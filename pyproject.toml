[project]
name = "algorithmic-institutions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "docopt>=0.6.2",
    "lxml>=6.0.2",
    "matplotlib<=3.7.3",
    "numpy<2.0.0",
    "pandas>=2.3.3",
    "pandera>=0.26.1",
    "pyarrow>=10",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "statannotations>=0.7.2",
    "statsmodels>=0.14.6",
    "torch==1.11.0+cu113",
    "torch-scatter==2.0.9",
    "torch-sparse==0.6.13",
    "torch-cluster==1.6.0",
    "torch-spline-conv==1.2.1",
    "torch-geometric==2.5.0",
    "fastparquet>=2024.11.0",
    "toolz>=1.1.0",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "black>=25.11.0",
    "flake8>=7.3.0",
    "ipdb>=0.13.13",
    "ipykernel>=6.31.0",
    "ipython>=8.18.1",
    "papermill>=2.6.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
]

[tool.uv]
find-links = [
  "https://download.pytorch.org/whl/cu113",
  "https://data.pyg.org/whl/torch-1.11.0+cu113.html"
]

[tool.uv.sources]
torch = { index = "pytorch-cu113" }

[[tool.uv.index]]
name = "pytorch-cu113"
url = "https://download.pytorch.org/whl/cu113"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimanager"]
