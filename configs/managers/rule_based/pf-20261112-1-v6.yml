params:
  n_full:
    definition: the group size (members this round) from which the manager makes an example of a free rider at a switch decision; with at least n_full of the 8 players in my group, ah's group holds at most 8 - n_full, so a punished free rider who leaves lands there (nearly) alone and is punished by ah, while my remaining members answer the visible punishment by giving more
    type: int
  gap_full:
    definition: the least gap, in contribution points per round over the current 4-round window, between the mean of my other members and the lowest member, for that member to be made an example when my group holds n_full or more; the example pays when it singles out a free rider in a group that cooperates and loses a little in a group of free riders
    type: float
  gap_six:
    definition: the least such gap for an example when my group holds exactly n_full - 1 (ah's group one larger); an example there pays only in a clearly cooperative group with a clear free rider, so the gap must be larger (a value near 20 means never)
    type: float
  bar:
    definition: absolute free-rider bar; only a member whose window mean contribution is at most bar can be punished, so the manager never makes an example of a real contributor even in a very generous group
    type: int
  amount:
    definition: punishment dealt to the example in the decision round; the response appears above a dose of about 13 and grows little beyond it, while my pool pays the whole dose
    type: int
  n_push:
    definition: most members punished at one decision, the lowest window-mean contributors first (the group's response does not grow with more targets, the cost does)
    type: int
  last_dec:
    definition: index of the last switch decision with a punishment (decision d follows round 3+4d; punishments start at decision 1, round 7); later examples have fewer rounds left to pay back
    type: int
sweep_config:
  n_full: 7
  gap_full: [0.0, 7.0]
  gap_six: [6.0, 20.0]
  bar: 12
  amount: 20
  n_push: 1
  last_dec: 3
constraints:
  - n_push >= 1
  - amount >= 1
  - n_full >= 2
code: |
  rounds = th.arange(c.shape[-1], device=c.device)
  win_now = th.div(t, 4, rounding_mode='floor')
  in_win = (th.div(rounds, 4, rounding_mode='floor') == win_now).float()
  w = valid * in_win
  n_win = w.sum(-1)
  c_win = (c * w).sum(-1) / th.clamp(n_win, min=1.0)
  member = in_group[..., -1]
  n_mem = member.sum(-1, keepdim=True)
  has = member * (n_win > 0).float()
  s_all = (has * c_win).sum(-1, keepdim=True)
  h_all = has.sum(-1, keepdim=True)
  others = (s_all - has * c_win) / th.clamp(h_all - has, min=1.0)
  gap = others - c_win
  need = th.where(n_mem >= n_full, gap_full + 0.0 * gap, th.where(n_mem >= n_full - 1, gap_six + 0.0 * gap, 1000.0 + 0.0 * gap))
  eligible = member * valid[..., -1] * (c_win <= bar).float() * (h_all - has >= 1.0).float()
  idx = th.arange(c.shape[1], device=c.device).float()
  score = c_win + 0.001 * idx + 1000.0 * (1.0 - eligible)
  rank = th.argsort(th.argsort(score, dim=-1), dim=-1).float()
  push = eligible * (rank < n_push).float() * (gap >= need).float()
  is_dec = (th.remainder(t + 1, 4) == 0) * (t >= 7) * (win_now <= last_dec)
  punishment = amount * push * is_dec
