params:
  c0:
    definition: >-
      absolute contribution level a member is expected to reach; the target a
      member is measured against is (1 - w) * c0 + w * (mean contribution of the
      other valid members of my group this round), and only members below the
      target are punished
    type: int
  w:
    definition: >-
      weight of the group's own norm in the target: 0 is a fixed level c0 for
      everyone, 1 punishes only falling below the rest of one's own group. The
      simulated players respond more, and leave less, when punished while
      sitting further below the rest of their group
    type: float
  k:
    definition: >-
      punishment points dealt in the first round of the game to a member who
      falls 5 points short of the target (a typical first-round shortfall);
      other shortfalls get k * (shortfall / 5)^gamma, capped at 30
    type: float
  gamma:
    definition: >-
      how steeply the punishment grows with the shortfall: 1 is proportional,
      above 1 concentrates the punishment on the largest shortfalls (the free
      riders, who respond most per point) and spares near-misses
    type: float
  decay:
    definition: >-
      factor by which the punishment shrinks from one four-round block to the
      next (block b is scaled by decay^b), because a lift has fewer rounds left
      to pay back and repeated punishment lifts less
    type: float
  follow:
    definition: >-
      factor on punishment in the second round of a block (and follow squared in
      the third), relative to the block's first round; the last round of a block,
      right before players may switch, is never punished
    type: float
  fresh:
    definition: >-
      factor on the punishment of a member in their first block in my group after
      having switched in (not in my group in the round before the last switch
      decision). Newcomers have just shown they change groups, leave again more
      readily when punished (about twice the exits per point in the simulation,
      a higher base rate in the human data) and respond about as much as
      stayers; below 1 spares them, above 1 treats them harder
    type: float
sweep_config:
  c0: [7, 15]
  w: [0, 1]
  k: [10, 100, log]
  gamma: [0.5, 3]
  decay: [0.1, 1, log]
  follow: [0, 1]
  fresh: [0, 2]
constraints:
  - c0 >= 1
  - w >= 0
  - w <= 1
  - k > 0
  - gamma > 0
  - decay > 0
  - follow >= 0
  - fresh >= 0
code: |
  # no float scalars as th arguments or in comparisons (they fail in a cold,
  # builtins-free exec); relu is max(0, .)
  now = c[..., -1]
  mine = in_group[..., -1] * valid[..., -1]
  # leave-one-out mean contribution of the other valid members of my group
  total = (now * mine).sum(-1).unsqueeze(-1)
  n = mine.sum(-1).unsqueeze(-1)
  others = th.relu(n - mine)  # for a member: n - 1
  has = th.sign(others)  # 1 if there is anyone else to compare with
  others_mean = (total - now * mine) / (others + 1 - has)
  target = c0 + w * has * (others_mean - c0)
  short = th.relu(target - now)
  shape = th.pow(short / 5, gamma)  # 0 at no shortfall, 1 at a shortfall of 5
  block = th.floor(t / 4)
  q = t - 4 * block  # place in the block, 0-3; 3 is the round before a switch decision
  pos = th.relu(1 - q) + follow * th.relu(1 - th.abs(q - 1)) + follow * follow * th.relu(1 - th.abs(q - 2))
  # in the last block (no decision follows) its last round is treated like its third
  last = th.relu(th.sign(block - 4))
  pos = pos + last * follow * follow * th.relu(1 - th.abs(q - 3))
  # newcomers: in my group now but not in the round before this block's start (block >= 1)
  rounds = th.arange(c.shape[-1], device=c.device)
  before = th.relu(1 - th.abs(rounds - (4 * block - 1)))  # 1 at round 4 * block - 1, else 0
  was_mine = (in_group * before).sum(-1)
  newcomer = th.sign(block) * (1 - was_mine)
  factor = 1 + (fresh - 1) * newcomer
  size = k * th.pow(decay, block) * pos
  punishment = size * shape * factor * mine
