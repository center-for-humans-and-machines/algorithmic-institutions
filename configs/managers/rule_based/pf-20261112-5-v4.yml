params:
  D0:
    definition: >-
      the shock at the start of block 0 (round 0, before any switch decision): the
      punishment points dealt to each targeted member; 0 means no shock there
    type: float
  D4:
    definition: >-
      the shock at the start of block 1 (round 4, right after the first switch decision,
      when the biggest reshuffle is done): points to each targeted member
    type: float
  D8:
    definition: >-
      the shock at the start of block 2 (round 8, right after the second switch decision):
      points to each targeted member
    type: float
  D12:
    definition: >-
      the shock at the start of block 3 (round 12, right after the third switch decision):
      points to each targeted member; no shock is dealt from round 13 on
    type: float
  hi:
    definition: >-
      the highest contribution that is still targeted: members of my group giving at most
      hi in a shock round are punished, members giving more are spared
    type: int
sweep_config:
  D0: [0.0, 30.0]
  D4: [0.0, 30.0]
  D8: [0.0, 30.0]
  D12: [0.0, 30.0]
  hi: [2, 9]
constraints:
  - D0 >= 0
  - D4 >= 0
  - D8 >= 0
  - D12 >= 0
code: |
  c_now = c[..., -1]
  member = in_group[..., -1] * valid[..., -1]
  n_mem = member.sum(dim=-1, keepdim=True)
  target = (c_now <= hi).float() * member * (n_mem > 1.5).float()
  dose = D0 * (t == 0).float() + D4 * (t == 4).float() + D8 * (t == 8).float() + D12 * (t == 12).float()
  punishment = dose * target
