params:
  k:
    definition: >-
      punishment points per contribution point a member falls short of the
      group's mean contribution this round (beyond the tolerance), when the
      other manager does not punish at all
    type: float
  s0:
    definition: >-
      tolerance, in contribution points below the group's mean this round,
      that goes unpunished
    type: float
  quiet:
    definition: >-
      number of rounds right before each switch decision (after rounds 3, 7,
      11, 15, 19) in which nobody is punished; 0 punishes in every round
    type: int
  t_end:
    definition: >-
      first round from which nobody is punished any more (no future rounds
      left to repay a punishment); 24 never stops
    type: int
  w:
    definition: >-
      how much the other manager's harshness licenses ours: k is multiplied
      by 1 + w * (the other manager's mean punishment per member-round so
      far)
    type: float
sweep_config:
  k: [0.05, 2.0, log]
  s0: [0.0, 8.0]
  quiet: [0, 3]
  t_end: [6, 24]
  w: [0.0, 1.0]
constraints:
  - k > 0
  - s0 >= 0
code: |
  cur = c[..., -1]
  mine = in_group[..., -1] * valid[..., -1]
  n = th.clamp(mine.sum(-1), min=1).unsqueeze(-1)
  mean = (cur * mine).sum(-1).unsqueeze(-1) / n
  short = th.clamp(mean - cur - s0, min=0)
  other = (1 - in_group[..., :-1]) * valid[..., :-1]
  op = (p * other).sum(-1).sum(-1) / th.clamp(other.sum(-1).sum(-1), min=1)
  scale = k * (1 + w * op)
  pos = th.remainder(t, 4)
  active = (t < t_end) & ((pos < 4 - quiet) | (t >= 20))
  punishment = scale.unsqueeze(-1) * short * active * mine
