params:
  pmax:
    definition: dose for a zero contributor before the clamp at 30; with d10 it fixes the curvature of the dose for contributions 0-10, pmax * (1 - c/20) ** log2(pmax / d10)
    type: float
  d10:
    definition: dose for a player contributing 10, half the endowment; the middle of the dose curve, where the score is most sensitive
    type: float
  d16:
    definition: dose for a near-full contributor at 16; the tail of the curve, d10 * ((20 - c)/10) ** k with k = log(d10/d16)/log(2.5) for 10 < c < 20, so how much the players just below full contribution are nudged; full contributors (c = 20) are never punished
    type: float
  horizon:
    definition: first round of the late phase; in rounds 0..horizon-1 (the shock) every valid player below 20 gets the dose
    type: int
  lthr:
    definition: free-rider line of the late phase; in rounds horizon..lstop-1 only players contributing less than lthr still get their (big) dose, everyone else nothing
    type: int
  lstop:
    definition: first round with no punishment at all, since a dose needs several rounds left to repay its double cost
    type: int
sweep_config:
  pmax: 32
  d10: [4.5, 9]
  d16: [0.3, 3.5]
  horizon: [4, 9]
  lthr: [2, 6]
  lstop: [12, 18]
constraints:
  - d16 < d10
code: |
  cnow = c[..., -1]
  g = th.log2(pmax / d10)
  k = th.log(d10 / d16) / th.log(th.ones_like(d10) * 2.5)
  low = pmax * th.pow(th.clamp(1 - cnow / 20, min=0, max=1), g)
  high = d10 * th.pow(th.clamp((20 - cnow) / 10, min=0, max=1), k)
  dose = th.clamp(th.where(cnow <= 10, low, high), max=30) * (cnow < 20).float()
  shock_on = (t < horizon).float() * th.ones_like(cnow)
  late_on = (t >= horizon).float() * (t < lstop).float() * (cnow < lthr).float()
  punishment = dose * th.maximum(shock_on, late_on) * valid[..., -1]
