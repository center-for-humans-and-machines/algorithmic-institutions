params:
  c0:
    definition: >-
      contribution level a member is expected to reach; only members contributing
      below it are punished, in proportion to their shortfall c0 - c
    type: int
  k:
    definition: >-
      punishment points per point of shortfall below c0 in the first round of the
      game (the first round of the first block)
    type: float
  decay:
    definition: >-
      factor by which the punishment shrinks from one four-round block to the
      next (block b is scaled by decay^b): the lift of a punishment is the same in
      any round but has fewer rounds left to pay back, and the contributions it
      has to correct are higher
    type: float
  follow:
    definition: >-
      factor on punishment in the second round of a block (and follow squared in the
      third), relative to the block's first round; the last round of a block,
      right before players may switch, is never punished. A punishment drives
      members out more the closer it comes to the switch decision
    type: float
  nblocks:
    definition: >-
      number of four-round blocks, from the first, in which the rule punishes at
      all; later blocks are left unpunished because a lift there has too few
      rounds left to repay its cost
    type: int
sweep_config:
  c0: [6, 16]
  k: [1, 15, log]
  decay: [0.1, 1]
  follow: [0, 1]
  nblocks: [1, 6]
constraints:
  - c0 >= 1
  - k > 0
  - decay > 0
  - follow >= 0
  - nblocks >= 1
code: |
  # no float scalars as th arguments or in comparisons (they fail in a cold,
  # builtins-free exec); relu is max(0, .)
  now = c[..., -1]
  mine = in_group[..., -1] * valid[..., -1]
  block = th.floor(t / 4)
  q = t - 4 * block  # place in the block, 0-3; 3 is the round before a switch decision
  pos = th.relu(1 - q) + follow * th.relu(1 - th.abs(q - 1)) + follow * follow * th.relu(1 - th.abs(q - 2))
  # in the last block (no decision follows) round 3 of the block is treated like round 2
  last = th.relu(th.sign(block - 4))
  pos = pos + last * follow * follow * th.relu(1 - th.abs(q - 3))
  active = th.relu(th.sign(nblocks - block))
  size = k * th.pow(decay, block) * pos * active
  punishment = size * th.relu(c0 - now) * mine
