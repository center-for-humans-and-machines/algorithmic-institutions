params:
  T:
    definition: >-
      target contribution; a player contributing T or more is never punished
    type: float
  A:
    definition: >-
      tap: the fixed punishment any player below the target gets, the signal
      that a shortfall was seen, whatever its size
    type: float
  B:
    definition: >-
      price per point of shortfall below the target, added to the tap, so a
      player contributing c < T is punished A + B * (T - c); above 0.6 a
      withheld point costs the player more than it keeps
    type: float
  S:
    definition: >-
      last punished round; from round S + 1 on the manager punishes no one,
      since the regime carries on by itself and late punishment cannot repay
      its cost in the rounds left
    type: int
  N:
    definition: >-
      strikes before the manager gives up on a player: a player already
      punished in N earlier rounds is not punished again, since one still
      below the target after N fines is not moved by fines and every further
      fine costs twice its size for nothing
    type: int
sweep_config:
  T: [11, 17]
  A: [0, 4]
  B: [1.0, 3.2, log]
  S: [6, 16]
  N: [3, 12]
code: |
  cur = c[..., -1]
  shortfall = th.relu(T - cur)
  scaled = th.where(shortfall > 0, A + B * shortfall, th.zeros_like(cur))
  strikes = (p > 0).float().sum(-1)
  scaled = th.where(strikes >= N, th.zeros_like(cur), scaled)
  active = (t <= S)
  punishment = th.where(active, scaled, th.zeros_like(cur))
