params:
  target_open:
    definition: contribution level below which a member is punished in rounds 0 and 1, the opening that sets the group's norm before the first switch decision
    type: float
  slope:
    definition: punishment points per contribution point a member falls short of the round's target (the manager clamps at 30, so a large slope makes the rule a threshold that deals the full 30 to anyone clearly below the target)
    type: float
  target_late:
    definition: maintenance norm in the first window_late rounds after the switch decisions of rounds 3, 7 and 11 (rounds 4, 8, 12 and, with window_late 2, also 5, 9, 13), for a group of four members
    type: float
  size_gain:
    definition: how much the maintenance target rises per member my group has above four (and falls per member below four); a big group holds its members and spreads the norm over more players, so punishing there is cheaper, while in a small group it can empty the group
    type: float
  window_late:
    definition: number of punishing rounds at the start of each later block (1 = only the round right after the decision, 2 = also the next one)
    type: int
sweep_config:
  target_open: [7.5, 12.5]
  slope: [2, 16, log]
  target_late: [3, 12]
  size_gain: [-1.5, 3]
  window_late: [1, 2]
constraints:
  - slope > 0
  - window_late >= 1
code: |
  ct = c[..., -1]
  member = in_group[..., -1]
  mine = member * valid[..., -1]
  one = th.ones_like(t)
  # my group's current size (members, including any who timed out this round)
  n = member.sum(-1).unsqueeze(-1)
  # opening: rounds 0 and 1
  is_open = (t < 1.5 * one).float()
  # maintenance: the first window_late rounds of blocks 1-3 (rounds 4.., 8.., 12..), nothing from round 16 on
  block = th.floor(t / (4 * one))
  pos = t - 4 * block
  is_late = ((pos < window_late - 0.5) & (block > 0.5 * one) & (block < 3.5 * one)).float()
  # the maintenance norm follows group size; never above 14, where punishment backfires on high contributors
  raw_m = th.relu(target_late + size_gain * (n - 4)) * th.ones_like(ct)
  target_m = th.minimum(raw_m, 14 * th.ones_like(ct))
  target_r = target_open * is_open + target_m * is_late
  shortfall = th.relu(target_r - ct)
  punishment = slope * shortfall * mine * (is_open + is_late)
