params:
  lo:
    definition: >-
      lowest contribution that is punished: at round 4 a member who gave fewer than lo points is left alone.
      Hard-core free riders (0-2) barely raise their giving after a hit and are the ones who then leave, so a hit
      on them is wasted points and members
    type: int
  hi:
    definition: >-
      highest contribution that is punished: at round 4 a member who gave more than hi points is left alone.
      Low-but-positive givers (about 3-5) raise their giving for the rest of the game after a hit and stay;
      middling and high givers cut back or leave
    type: int
  amt:
    definition: >-
      the punishment in points dealt once, at round 4 (the first round after the first switch decision, the
      farthest from the next one, with 19 rounds left for the raised giving to carry), to every member who gave
      between lo and hi points that round
    type: float
sweep_config:
  lo: [0, 4]
  hi: [4, 7]
  amt: [8, 28]
code: |
  here = in_group[..., -1] * valid[..., -1]
  cc = c[..., -1]
  at4 = (t == 4).float()
  band = (cc >= lo).float() * (cc <= hi).float()
  punishment = at4 * here * band * amt
