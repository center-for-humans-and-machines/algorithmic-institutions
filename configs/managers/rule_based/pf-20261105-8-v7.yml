params:
  free:
    definition: >-
      the curve's value at zero contribution: punishment = free * ((20 - c) / 20) ** k,
      clamped to 30, so a free rider gets min(free, 30); above 30 it also steepens the
      curve near zero (players giving 1-3 get closer to the maximum)
    type: float
  mid:
    definition: >-
      the punishment of a player who contributes half (10); it sets how fast the curve
      falls, k = log2(free / mid): a low mid spares the middle and concentrates the
      punishment on free riders
    type: float
  horizon:
    definition: >-
      end of the opening phase: in rounds t < horizon (0-based) every valid player gets
      the curve, repeats included; after it, hitting the same low player again no longer
      repays
    type: int
  high:
    definition: >-
      the drop line: in rounds horizon <= t < end a player is punished (on the same
      curve) only if he contributed at least this much in the previous round, was valid
      then, and gives less now; a fresh drop of a cooperator is answered, a chronic low
      contributor is left alone
    type: float
  end:
    definition: >-
      the first round (0-based) in which nobody is punished any more, not even a fresh
      drop: afterwards too few rounds remain for the raise to repay
    type: int
sweep_config:
  free: [24, 34]
  mid: [4.5, 9.5]
  horizon: [3, 9]
  high: [10, 20]
  end: [10, 20]
constraints:
  - free > mid
  - mid > 0
  - end > horizon
code: |
  now = c[..., -1]
  prev = th.cat([c[..., :1], c], dim=-1)[..., -2]
  prev_valid = th.cat([valid[..., :1], valid], dim=-1)[..., -2]
  k = th.log(free / mid) / 0.6931471805599453
  base = free * (th.clamp(20 - now, min=0) / 20) ** k
  main = (t < horizon).to(now.dtype)
  drop = (prev >= high).to(now.dtype) * (now < prev).to(now.dtype) * prev_valid
  late = ((t >= horizon) & (t < end)).to(now.dtype) * drop
  punishment = base * th.clamp(main + late, max=1) * valid[..., -1]
