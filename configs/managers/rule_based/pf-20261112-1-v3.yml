params:
  n_full:
    definition: the group size (members this round) from which the manager pushes free riders at a switch decision; when the group holds at least n_full of the 8 players, ah's group is (nearly) empty and a pushed free rider lands there alone; 9 means never, i.e. the manager never punishes
    type: int
  bar:
    definition: free-rider bar; only a member whose mean contribution over the current 4-round window (up to this round) is at most bar can be pushed
    type: int
  amount:
    definition: punishment dealt to each pushed member in the decision round; it makes him leave and, carried into ah's group as his previous punishment, makes ah punish him there round after round
    type: int
  n_push:
    definition: most members pushed at one decision, the lowest window-mean contributors among those at or below the bar
    type: int
  last_dec:
    definition: index (1-4) of the last switch decision with a push (decision d follows round 3+4d; decisions 1..last_dec, never decision 0, where groups start at 4); later pushes have fewer rounds left to pay back
    type: int
sweep_config:
  n_full: [7, 9]
  bar: [0, 6]
  amount: [5, 30]
  n_push: [1, 3]
  last_dec: [1, 4]
constraints:
  - n_push >= 1
  - amount >= 1
code: |
  rounds = th.arange(c.shape[-1], device=c.device)
  win_now = th.div(t, 4, rounding_mode='floor')
  in_win = (th.div(rounds, 4, rounding_mode='floor') == win_now).float()
  w = valid * in_win
  c_win = (c * w).sum(-1) / th.clamp(w.sum(-1), min=1.0)
  member = in_group[..., -1]
  n_mem = member.sum(-1, keepdim=True)
  eligible = member * valid[..., -1] * (c_win <= bar).float()
  idx = th.arange(c.shape[1], device=c.device).float()
  score = c_win + 0.001 * idx + 1000.0 * (1.0 - eligible)
  rank = th.argsort(th.argsort(score, dim=-1), dim=-1).float()
  push = eligible * (rank < n_push).float() * (n_mem >= n_full).float()
  is_dec = (th.remainder(t + 1, 4) == 0) * (t >= 7) * (win_now <= last_dec)
  punishment = amount * push * is_dec
