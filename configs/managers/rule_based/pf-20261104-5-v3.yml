params:
  k:
    definition: punishment points per contribution point a member gives below the threshold, for a player not yet punished
    type: float
  thr:
    definition: contribution threshold; members giving at least this much are never punished
    type: float
  cap:
    definition: largest punishment any member gets in one round
    type: float
  budget:
    definition: punishment-history scale; a player's punishment is multiplied by exp(-received / budget), where received is all punishment it has been charged so far in the game by either manager
    type: float
  quiet:
    definition: factor on punishments in the rounds right before a switch decision (rounds 3, 7, 11, 15, 19)
    type: float
  t_stop:
    definition: last round in which the manager punishes; later rounds go unpunished
    type: int
sweep_config:
  k: [1.0, 10.0, log]
  thr: [4.0, 14.0]
  cap: [5.0, 30.0]
  budget: [5.0, 300.0, log]
  quiet: [0.0, 1.0]
  t_stop: [2, 21]
constraints:
  - k > 0
  - cap >= 1
  - budget > 0
code: |
  now = c[..., -1]
  member = in_group[..., -1] * valid[..., -1]
  received = p.sum(-1)
  base = th.minimum(k * th.relu(thr - now), cap * th.ones_like(now))
  fresh = th.exp(-received / budget)
  decision = ((t - 4 * th.floor(t / 4)) == 3) * (t < 20)
  timing = th.where(decision, quiet, th.ones_like(quiet)) * (t <= t_stop)
  punishment = base * fresh * timing * member
