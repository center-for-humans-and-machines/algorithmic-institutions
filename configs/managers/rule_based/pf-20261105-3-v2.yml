params:
  thr:
    definition: contribution standard; a player contributing less than thr is punished, by how far it falls short (shortfall = thr - c)
    type: int
  pmax:
    definition: punishment for a zero contributor at full strength (early in the game); the dose for a shortfall s is pmax * (s / thr) ** gamma
    type: float
  gamma:
    definition: curvature of the dose in the shortfall; 1 is linear, above 1 keeps big doses for free riders and gives moderate contributors much less
    type: float
  warn:
    definition: fixed extra punishment for anyone below the standard (a nudge that survives the flooring to integers for small shortfalls)
    type: float
  horizon:
    definition: first round in which the manager no longer punishes (it punishes rounds 0..horizon-1), since late punishment has too few rounds left to pay back
    type: int
  taper:
    definition: how fast punishment fades toward the horizon; strength is ((horizon - t) / horizon) ** taper, 0 means flat
    type: float
sweep_config:
  thr: [12, 20]
  pmax: [12, 30]
  gamma: [0.6, 2.6]
  warn: [0, 4]
  horizon: [6, 22]
  taper: [0, 2]
constraints:
  - pmax >= 12
  - horizon >= 6
code: |
  cnow = c[..., -1]
  shortfall = th.clamp(thr - cnow, min=0)
  below = (shortfall > 0).float()
  frac = th.clamp(shortfall / thr, min=0, max=1)
  dose = pmax * th.pow(frac, gamma) + warn * below
  left = th.clamp((horizon - t) / horizon, min=0)
  strength = th.pow(left, taper) * (t < horizon).float()
  punishment = th.clamp(dose, max=30) * strength * valid[..., -1]
