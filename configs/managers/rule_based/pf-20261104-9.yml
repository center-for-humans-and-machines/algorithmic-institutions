params:
  rel:
    definition: >-
      laggard threshold as a fraction of the mean contribution of the other
      valid members of the group this round; a member contributing less is
      punished in proportion to the gap
    type: float
  slope:
    definition: punishment points per contribution point of shortfall below the threshold
    type: float
  cap:
    definition: largest punishment dealt to one member in one round
    type: float
  last_round:
    definition: >-
      last round (0-23) in which the manager punishes; later rounds are left
      unpunished because too few rounds remain for the lift to repay its cost
    type: int
  pre_switch:
    definition: >-
      multiplier on the punishment in the rounds just before a switch
      decision (rounds 3, 7, 11, 15, 19)
    type: float
sweep_config:
  rel: [0.2, 1.0]
  slope: [0.2, 5, log]
  cap: [2, 16]
  last_round: [12, 23]
  pre_switch: [0, 2]
constraints:
  - rel > 0
  - slope > 0
  - cap >= 1
code: |
  mine = in_group[..., -1] * valid[..., -1]
  cnow = c[..., -1]
  zero = th.zeros_like(cnow)
  one = th.ones_like(cnow)
  n_mine = mine.sum(-1).unsqueeze(-1)
  tot = (cnow * mine).sum(-1).unsqueeze(-1)
  n_others = n_mine - mine
  ref = (tot - cnow * mine) / th.maximum(n_others, one)
  short = th.maximum(rel * ref - cnow, zero)
  pun = th.minimum(slope * short, cap * one)
  pun = pun * th.gt(n_others, 0.5 * one) * mine
  before_switch = th.eq(th.remainder(t + 1.0, 4.0), 0.0) * th.lt(t, 20.0)
  mult = pre_switch * before_switch + (1.0 - 1.0 * before_switch)
  active = 1.0 * th.le(t, last_round)
  punishment = pun * mult * active
