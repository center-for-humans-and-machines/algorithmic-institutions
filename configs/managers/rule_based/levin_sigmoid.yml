# Levin's sigmoid rule (#219): a soft threshold on this round's contribution,
# faded over the episode and before each reshuffle. Restored from
# origin/230-rule-config (configs/managers/rule_based/sigmoid.yml, deleted in
# #235) and ported to the #245 inputs: `c` is now the contribution history, so
# the rule reads its last round. An opponent of the exp2_multi policy finder
# (docs/plans/policy-finder-multi-opponent.md), at #219's common-pool optimum
# (sigmoid_opt_pool.json):
#   p_max 30.0, c0 7.13780183612438, tau 0.4249189420822854,
#   gamma_ep 3.0, gamma_sw 1.418622533255372

params:
  p_max:
    definition: punishment at full strength
    type: float
  c0:
    definition: contribution at which the gate is half open
    type: float
  tau:
    definition: softness of the gate around c0
    type: float
  gamma_ep:
    definition: how fast punishment fades over the episode (0 = no fading)
    type: float
  gamma_sw:
    definition: how much it drops before a reshuffle (0 = no drop)
    type: float

constraints:
  - tau > 0
  - p_max >= 0

code: |
  cur = c[..., -1]
  f = 1 / (1 + th.exp((cur - c0) / tau))
  m_ep = ((24 - t) / 24) ** gamma_ep
  s = 3 - th.remainder(t, 4.0)
  m_sw = ((s + 1) / 4) ** gamma_sw
  punishment = th.round(p_max * f * m_ep * m_sw)
