params:
  n_blocks:
    definition: >-
      number of 4-round blocks, counted from the start of the game, whose first round (0, 4, 8, 12, 16) may
      carry punishment; 0 = never punish (the zero policy). Punishment is never dealt in any other round
      (not mid-block, not at a switch decision, not in rounds 20-23).
    type: int
  thr:
    definition: >-
      free-riding threshold in contribution points: only a member contributing at most thr is a free rider
    type: int
  streak:
    definition: >-
      persistence required: a member is punished only if it contributed at most thr in each of the last
      streak rounds (this one included; at round 0, with no history, the current round only), so one-round
      dips, which recover on their own, are left alone
    type: int
  amt:
    definition: >-
      flat punishment in points dealt to each persistent free rider at an eligible block start (floored to
      an integer, so amt < 1 means no punishment)
    type: float
sweep_config:
  n_blocks: [0, 5]
  thr: [0, 8]
  streak: [1, 3]
  amt: [0.8, 12, log]
code: |
  T = c.shape[-1]
  pos = th.remainder(t, 4.0)
  eligible = (pos == 0).float() * (t < 4.0 * n_blocks).float() * (t < 20).float()
  idx = th.arange(T, device=c.device).float()
  recent = (idx >= t + 1 - streak).float()
  low = (c <= thr).float()
  n_low = (low * recent).sum(-1)
  n_need = th.clamp(th.minimum(streak, t + 1.0), min=1.0)
  persistent = (n_low >= n_need).float()
  punishment = amt * persistent * eligible * valid[..., -1]
