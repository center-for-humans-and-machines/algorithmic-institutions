# Levin's sigmoid rule (#219): a soft threshold on this round's contribution,
# faded over the episode and before each reshuffle.
#
# `code` runs inside RuleBasedManager with these names in scope:
#   c         contribution this round, per player (float tensor, 0-20)
#   t         round number, per player (float tensor, 0-23)
#   th        torch
#   each name declared under `params`, from the params JSON
# It must set `punishment`; the manager then clamps it to [0, 30] and casts
# to integers. The params JSON must hold exactly the names declared under
# `params`.
#
# Fitted sets in params/, both from #219 (final stack, one group against the
# AH manager):
#   sigmoid_opt_pool.json         the common-pool optimum; punishes up to 30,
#                                 beyond what the contribution model saw
#   sigmoid_best_cap10_pool.json  the best one that never punishes above 10

params:
  p_max: punishment at full strength
  c0: contribution at which the gate is half open
  tau: softness of the gate around c0 (> 0)
  gamma_ep: how fast punishment fades over the episode (0 = no fading)
  gamma_sw: how much it drops before a reshuffle (0 = no drop)

code: |
  f = 1 / (1 + th.exp((c - c0) / tau))     # the contribution gate
  m_ep = ((24 - t) / 24) ** gamma_ep       # what is left of the episode
  s = 3 - (t % 4)
  m_sw = ((s + 1) / 4) ** gamma_sw         # what is left of this player's tenure
  punishment = th.round(p_max * f * m_ep * m_sw)
