description: >-
  Small test run of the artificial humans model using full features but a tiny workload.

exec:
  command: python src/aimanager/artificial_humans/train.py {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: temp/test_small
  cores: 2         # smaller than default for a light job
  memory: 4        # GB, smaller than default

# We want a single concrete job, not a grid
params_only: true
params:
  __notebook__: notebooks/artificial_humans/graph.ipynb
  fraction_training: 1.0          # smaller fraction to keep it fast
  seed: 123                       # any fixed seed
  mask_name: contribution_valid
  experiment_names: [trail_rounds_2]
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 2                  # fewer folds to keep it light
  n_player: 4
  data_file: experiments/pilot_random1_player_round_slim.csv
  model_name: graph
  shuffle_features: [prev_punishment, prev_contribution, contribution_valid]
  basedir: .
  output_dir: artifacts/artificial_humans/test_small

  model_args:
    y_levels: 21
    y_name: contribution
    hidden_size: 5
    add_rnn: true
    add_edge_model: true
    add_global_model: false
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - etype: bool
        name: prev_contribution_valid

  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5

  train_args:
    epochs: 100      # much smaller than 10000 for a quick test
    batch_size: 10
    clamp_grad: 1
    eval_period: 10  # more frequent evals on a short run
    l1_entropy: 0

  device: cuda
  autoregression: false
