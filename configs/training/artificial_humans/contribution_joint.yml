description: >-
  Joint contribution + validity model. Single model predicting both
  contribution (21 classes) and validity (2 classes) via extended
  output vector. Replaces separate contribution and validity models.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: contribution_valid
  experiment_names: [trail_rounds_2, random_1]
  labels:
    architecture: node+edge+rnn
    dataset: full
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 6
  n_player: 4
  data_file: experiments/pilot_random1_player_round_slim.csv
  model_name: graph
  shuffle_features: []
  basedir: .
  output_dir: artifacts/artificial_humans/contribution_joint
  model_args:
    y_levels: 21
    y_name: contribution
    hidden_size: 5
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    joint_output:
      - name: contribution
        n_levels: 21
      - name: contribution_valid
        n_levels: 2
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - etype: bool
        name: prev_contribution_valid
  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 10000
    batch_size: 10
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: False
