description: >-
  Contribution validity model. Predicts whether a participant provided
  input (vs timed out). Recreates the djx script 22 config in modern
  format (python -m aimanager train-ah).
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 1234
  mask_name: recorded
  experiment_names: [trail_rounds_2, random_1]
  labels:
    rnn: false
    dataset: full
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 6
  n_player: 4
  data_file: experiments/pilot_random1_player_round_slim.csv
  model_name: graph
  shuffle_features: []
  basedir: .
  output_dir: artifacts/artificial_humans/contribution_valid
  model_args:
    y_levels: 2
    y_name: contribution_valid
    hidden_size: 5
    add_rnn: False
    add_edge_model: False
    add_global_model: False
    x_encoding:
      - etype: bool
        name: prev_contribution_valid
  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 10000
    batch_size: 10
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: false
