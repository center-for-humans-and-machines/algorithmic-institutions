description: >-
  Type-latent arm of the M0 contribution predictor
  (group_switching_contribution_50ep.yml): identical data / CV / seed /
  epochs / lr / encodings, the ONLY change being an optional per-agent,
  per-episode latent z (agent_latent) trained VAE-style — GRU trajectory
  encoder for q(z|episode), standard-normal prior, z concatenated onto
  the node features every round, ELBO = CE + beta * KL with free bits and
  a linear beta warmup. Behavioral rationale: real players carry
  persistent dispositions (free-rider, conditional cooperator,
  altruist), while the reference model redraws every agent from the same
  conditional each round, so simulated trajectories have no stable
  identity and group means collapse toward the population mean (CG 9.85,
  band > 5). A latent held fixed for the whole episode gives
  trajectories persistent heterogeneity whose interaction with the
  learned peer response amplifies between-group divergence — exactly the
  mechanism CG measures. Simulation samples z ~ p(z) once per agent per
  episode. Separate output_dir so the M0 baseline artifact is preserved.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: contribution_valid
  experiment_names: [ah_group_switching]
  labels:
    architecture: node+edge+rnn+type_latent
    dataset: 50ep
    epochs: 575
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features: [agent_group, prev_contribution, prev_punishment]
  basedir: .
  output_dir: artifacts/artificial_humans/group_switching_contribution_50ep_type_latent
  model_args:
    y_levels: 21
    y_name: contribution
    hidden_size: 20
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    agent_latent:
      dim: 4
      hidden_size: 20
      beta: 1.0
      free_bits: 0.02
      anneal_epochs: 100
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - name: agent_group
        n_levels: 2
        encoding: onehot
  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 575
    batch_size: 4
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: False
