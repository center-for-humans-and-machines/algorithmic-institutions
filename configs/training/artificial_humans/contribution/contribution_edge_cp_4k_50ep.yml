description: >-
  Focused 2-run grid: the edge-only contribution model (edge, no rnn) on
  prev_contribution + prev_punishment, with and without agent_group
  (onehot), trained to 4000 epochs. The 2000-epoch grid's edge_cp had its
  best epoch at 1999 (still descending = not converged), so this extends
  the schedule to find its true floor, and adds the edge_cp_ag variant
  (absent from the original grid) to test the agent_group effect on the
  edge-only architecture. Same budget otherwise (hidden=20, lr=3e-4,
  5-fold pair-aware CV). Distinct output_dir + epochs=4000 label so it
  doesn't collide with the 2k grid. Launch with:
  scripts/train_cluster.sh ah configs/training/artificial_humans/contribution/contribution_edge_cp_4k_50ep.yml
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: contribution_valid
  experiment_names: [ah_group_switching]
  labels:
    architecture: edge_cp
    dataset: 50ep
    epochs: 4000
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features: [prev_contribution, prev_punishment]
  basedir: .
  output_dir: artifacts/artificial_humans/contribution_edge_cp_4k_50ep
  model_args:
    y_levels: 21
    y_name: contribution
    hidden_size: 20
    add_rnn: False
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 4000
    batch_size: 4
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: False
grid:
  # 2 runs: edge (no rnn), prev_contr + prev_punishment, without / with agent_group.
  -
    # edge_cp: no agent_group
    - labels.architecture: edge_cp
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
        - {name: prev_punishment, n_levels: 31, encoding: numeric}
      shuffle_features: [prev_contribution, prev_punishment]
    # edge_cp_ag: + agent_group (onehot)
    - labels.architecture: edge_cp_ag
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
        - {name: prev_punishment, n_levels: 31, encoding: numeric}
        - {name: agent_group, n_levels: 2, encoding: onehot}
      shuffle_features: [prev_contribution, prev_punishment, agent_group]
