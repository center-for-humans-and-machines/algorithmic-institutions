description: >-
  M1 arm (#112): the M0 contribution predictor
  (group_switching_contribution_50ep.yml) plus a same_group EDGE feature, so the
  edge MLP can route own- vs other-group messages directly instead of having to
  learn the agent_group equality (M0 leaves agent_group importance ≈0 — a
  learnability gap, not a capacity one). Identical data / CV / seed / epochs to
  M0; the ONLY change is `edge_encoding: [same_group]`. agent_group is kept as a
  node feature (the agent_group-drop ablation is a separate arm). Writes to a new
  output_dir so the M0 baseline artifact (test log_loss 1.9897) is preserved for
  comparison.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: contribution_valid
  experiment_names: [ah_group_switching]
  labels:
    architecture: node+edge+rnn
    dataset: 50ep
    epochs: 575
    same_group: true
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features: [prev_contribution, prev_punishment]
  basedir: .
  output_dir: artifacts/artificial_humans/group_switching_contribution_50ep_same_group
  model_args:
    y_levels: 21
    y_name: contribution
    hidden_size: 20
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
    edge_encoding:
      - name: same_group
        etype: bool
  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 575
    batch_size: 4
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: False
