description: >-
  Agent-group companion to contribution_architecture_grid_50ep. Three
  runs, all with agent_group (onehot): (1) prev_contr, rnn, no edge;
  (2) prev_contr, rnn + edge; (3) prev_contr + prev_punishment, rnn +
  edge. (1) vs (2) shows whether the edge model leverages agent_group;
  each pairs against the no-agent_group grid's matching run for a paired
  delta. Writes into the SAME output_dir (analyze_ah_metrics.py ranks all
  runs together); "_ag" labels keep job_ids distinct. Identical budget
  (hidden=20, lr=3e-4, 2000 epochs, 5-fold pair-aware CV). Launch with:
  scripts/train_cluster.sh ah configs/training/artificial_humans/contribution/contribution_architecture_grid_50ep_agent_group.yml
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: contribution_valid
  experiment_names: [ah_group_switching]
  labels:
    architecture: edge+rnn_c_ag
    dataset: 50ep
    epochs: 2000
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features: [prev_contribution, agent_group]
  basedir: .
  output_dir: artifacts/artificial_humans/contribution_architecture_grid_50ep
  model_args:
    y_levels: 21
    y_name: contribution
    hidden_size: 20
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: agent_group
        n_levels: 2
        encoding: onehot
  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 2000
    batch_size: 4
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: False
grid:
  # Three runs, all with agent_group (onehot).
  -
    # rnn, no edge (prev_contr + agent_group)
    - labels.architecture: rnn_c_ag
      model_args.add_rnn: true
      model_args.add_edge_model: false
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
        - {name: agent_group, n_levels: 2, encoding: onehot}
      shuffle_features: [prev_contribution, agent_group]
    # rnn + edge (prev_contr + agent_group)
    - labels.architecture: edge+rnn_c_ag
      model_args.add_rnn: true
      model_args.add_edge_model: true
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
        - {name: agent_group, n_levels: 2, encoding: onehot}
      shuffle_features: [prev_contribution, agent_group]
    # rnn + edge (prev_contr + prev_punishment + agent_group) -- all 3 features
    - labels.architecture: edge+rnn_cp_ag
      model_args.add_rnn: true
      model_args.add_edge_model: true
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
        - {name: prev_punishment, n_levels: 31, encoding: numeric}
        - {name: agent_group, n_levels: 2, encoding: onehot}
      shuffle_features: [prev_contribution, prev_punishment, agent_group]
