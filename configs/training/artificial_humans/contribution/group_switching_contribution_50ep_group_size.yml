description: >-
  M0 contribution predictor (group_switching_contribution_50ep.yml) plus
  own_group_size as a numeric NODE feature — the current-round member count
  of the agent's own group (n_levels=9, IntEncoder maps v -> v/8). Tests
  whether the trunk can respond to the marginal per-capita return, which M0
  has no feature to express at all: no edge carries membership (every i != j
  pair is fully connected regardless of group) and agent_group is a onehot
  label with no size or level information. See
  notes/autoresearch_log/contribution-group-size.md. Identical data / CV /
  seed / epochs to M0; the ONLY change is the added node feature — every
  other hyperparameter is copied verbatim because this tests a mechanism,
  not a tuning. Separate output_dir so the M0 baseline artifact (test
  log_loss 1.9892) is preserved.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: contribution_valid
  experiment_names: [ah_group_switching]
  labels:
    architecture: node+edge+rnn
    dataset: 50ep
    epochs: 575
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features: [agent_group, prev_contribution, prev_punishment]
  basedir: .
  output_dir: artifacts/artificial_humans/group_switching_contribution_50ep_group_size
  model_args:
    y_levels: 21
    y_name: contribution
    hidden_size: 20
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - name: agent_group
        n_levels: 2
        encoding: onehot
      - name: own_group_size
        n_levels: 9
        encoding: numeric
  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 575
    batch_size: 4
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: False
