description: >-
  M4 arm (#114): M3 (own_grp_prev_mean_contr node feature) PLUS the same_group
  edge feature from #112 (merged on main, so config-only — no model change). The
  combined arm where same_group finally has a real own-group contribution signal
  to route: M0 / M3 / M4 isolates the node feature alone vs. node feature + edge
  routing. Identical data / CV / seed / epochs to M0; separate output_dir so the
  M0 and M3 artifacts are preserved.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: contribution_valid
  experiment_names: [ah_group_switching]
  labels:
    architecture: node+edge+rnn
    dataset: 50ep
    epochs: 575
    own_group: true
    same_group: true
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features: [agent_group, prev_contribution, prev_punishment]
  basedir: .
  output_dir: artifacts/artificial_humans/group_switching_contribution_50ep_own_group_same_group
  model_args:
    y_levels: 21
    y_name: contribution
    hidden_size: 20
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - name: agent_group
        n_levels: 2
        encoding: onehot
      - name: own_grp_prev_mean_contr
        etype: float
        norm: 20
    edge_encoding:
      - name: same_group
        etype: bool
  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 575
    batch_size: 4
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: False
