description: >-
  Consolidated contribution architecture/feature grid on the 50-episode
  group-switching data (pair-augmented, pair-aware CV) -- all 10 runs in
  one config, one output_dir, one wandb group. Sweeps architecture
  (node MLP / rnn / edge / edge+rnn) x feature set (prev_contribution,
  +prev_punishment, +agent_group onehot). The edge-only runs (edge_cp,
  edge_cp_ag) need a longer schedule to converge, so they override epochs
  to 4000; every other run is 2000 (they overfit by ~600, best epoch is
  reported per run). Shared budget otherwise: hidden=20, lr=3e-4, 5-fold
  pair-aware CV. Analyse with: fetch_wandb_grid.py (clean per-fold test
  log-loss from wandb -- the local parquet baseline is unreliable for
  multi-shuffle runs) then plot_grid_*.py. Launch with:
  scripts/train_cluster.sh ah configs/training/artificial_humans/contribution/contribution_grid_full_50ep.yml
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: contribution_valid
  experiment_names: [ah_group_switching]
  labels:
    architecture: edge+rnn_cp
    dataset: 50ep
    epochs: 2000
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features: [prev_contribution, prev_punishment]
  basedir: .
  output_dir: artifacts/artificial_humans/contribution_grid_full_50ep
  model_args:
    y_levels: 21
    y_name: contribution
    hidden_size: 20
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 2000
    batch_size: 4
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: False
grid:
  # 10 runs. Feature codes: c = prev_contribution, cp = +prev_punishment,
  # _ag = +agent_group (onehot). edge-only runs go to 4000 epochs.
  -
    # --- MLP (node only) ---
    - labels.architecture: node_c
      model_args.add_rnn: false
      model_args.add_edge_model: false
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
      shuffle_features: [prev_contribution]
    - labels.architecture: node_cp
      model_args.add_rnn: false
      model_args.add_edge_model: false
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
        - {name: prev_punishment, n_levels: 31, encoding: numeric}
      shuffle_features: [prev_contribution, prev_punishment]
    # --- rnn only ---
    - labels.architecture: rnn_cp
      model_args.add_rnn: true
      model_args.add_edge_model: false
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
        - {name: prev_punishment, n_levels: 31, encoding: numeric}
      shuffle_features: [prev_contribution, prev_punishment]
    - labels.architecture: rnn_c_ag
      model_args.add_rnn: true
      model_args.add_edge_model: false
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
        - {name: agent_group, n_levels: 2, encoding: onehot}
      shuffle_features: [prev_contribution, agent_group]
    # --- edge only (4000 epochs) ---
    - labels.architecture: edge_cp
      labels.epochs: 4000
      train_args.epochs: 4000
      model_args.add_rnn: false
      model_args.add_edge_model: true
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
        - {name: prev_punishment, n_levels: 31, encoding: numeric}
      shuffle_features: [prev_contribution, prev_punishment]
    - labels.architecture: edge_cp_ag
      labels.epochs: 4000
      train_args.epochs: 4000
      model_args.add_rnn: false
      model_args.add_edge_model: true
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
        - {name: prev_punishment, n_levels: 31, encoding: numeric}
        - {name: agent_group, n_levels: 2, encoding: onehot}
      shuffle_features: [prev_contribution, prev_punishment, agent_group]
    # --- edge + rnn ---
    - labels.architecture: edge+rnn_c
      model_args.add_rnn: true
      model_args.add_edge_model: true
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
      shuffle_features: [prev_contribution]
    - labels.architecture: edge+rnn_cp
      model_args.add_rnn: true
      model_args.add_edge_model: true
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
        - {name: prev_punishment, n_levels: 31, encoding: numeric}
      shuffle_features: [prev_contribution, prev_punishment]
    - labels.architecture: edge+rnn_c_ag
      model_args.add_rnn: true
      model_args.add_edge_model: true
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
        - {name: agent_group, n_levels: 2, encoding: onehot}
      shuffle_features: [prev_contribution, agent_group]
    - labels.architecture: edge+rnn_cp_ag
      model_args.add_rnn: true
      model_args.add_edge_model: true
      model_args.x_encoding:
        - {name: prev_contribution, n_levels: 21, encoding: numeric}
        - {name: prev_punishment, n_levels: 31, encoding: numeric}
        - {name: agent_group, n_levels: 2, encoding: onehot}
      shuffle_features: [prev_contribution, prev_punishment, agent_group]
