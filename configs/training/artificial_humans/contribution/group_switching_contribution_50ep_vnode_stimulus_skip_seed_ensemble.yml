description: >-
  Seed ensemble of the PR #181 stimulus-skip contributor
  (group_switching_contribution_50ep_vnode_stimulus_skip.yml): the same
  trunk retrained five times on the full flip-doubled training data with
  five different seeds (the seed drives the parameter init, the batch
  order, the mask-pattern draws and the 5-fold CV partition; the shipped
  artifact used 38381). Purpose: measure parameter (epistemic)
  uncertainty -- between-seed disagreement of the teacher-forced
  predictions and its within-group shared part -- against the copula's
  fitted rho (copula-seed-ensemble.md). Everything else is byte-identical
  to the PR #181 config.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
grid:
  - seed: [1, 2, 3, 4, 5]
    labels.seed: [1, 2, 3, 4, 5]
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: contribution_valid
  experiment_names: [ah_group_switching]
  labels:
    architecture: node+edge+rnn
    dataset: 50ep
    epochs: 575
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features: [agent_group, prev_contribution, prev_punishment]
  basedir: .
  output_dir: artifacts/artificial_humans/group_switching_contribution_50ep_vnode_stimulus_skip_seed_ensemble
  model_args:
    y_levels: 21
    y_name: contribution
    hidden_size: 20
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    group_vnode: True
    stimulus_skip: True
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - name: agent_group
        n_levels: 2
        encoding: onehot
  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 575
    batch_size: 4
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: False
