description: >-
  Contribution-punishment-response experiment (PR #179 parent stack):
  the per-group-vnode contributor (group_switching_contribution_50ep_group_vnode)
  plus an immediate-stimulus skip (model_args.stimulus_skip: True) --
  op2 reads the post-op1 per-agent embedding alongside the post-RNN one,
  so what the agent just gave and just got punished for reaches the next
  decision directly and not only through the carried recurrent state.
  group_vnode stays True: this stacks on the parent, both are on.
  Everything else is byte-identical to the parent: node+edge+rnn
  architecture, hidden=20, lr=3e-4, 575 epochs, batch 4, 5-fold CV, seed
  38381, same x_encoding (prev_contribution and prev_punishment stay
  numeric -- step 0 showed the teacher-forced conditional is already
  human-like, so the encoding is deliberately unchanged here) and
  shuffle_features, same data file, mask, and experiment names.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: contribution_valid
  experiment_names: [ah_group_switching]
  labels:
    architecture: node+edge+rnn
    dataset: 50ep
    epochs: 575
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features: [agent_group, prev_contribution, prev_punishment]
  basedir: .
  output_dir: artifacts/artificial_humans/group_switching_contribution_50ep_vnode_stimulus_skip
  model_args:
    y_levels: 21
    y_name: contribution
    hidden_size: 20
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    group_vnode: True
    stimulus_skip: True
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - name: agent_group
        n_levels: 2
        encoding: onehot
  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 575
    batch_size: 4
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: False
