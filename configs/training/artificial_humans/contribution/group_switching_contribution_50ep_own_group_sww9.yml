description: 'M3 (own_grp_prev_mean_contr) + switch-arrival loss upweight (switch_weight=9,
  #114). Tests whether paying the model for the peer-relevant rounds raises its learned
  peer coefficient (probe target: human ~0.15 vs current 0.084).'
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: contribution_valid
  experiment_names:
  - ah_group_switching
  labels:
    architecture: node+edge+rnn
    dataset: 50ep
    epochs: 575
    own_group: true
    switch_weight: 9
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features:
  - agent_group
  - prev_contribution
  - prev_punishment
  basedir: .
  output_dir: artifacts/artificial_humans/group_switching_contribution_50ep_own_group_sww9
  model_args:
    y_levels: 21
    y_name: contribution
    hidden_size: 20
    add_rnn: true
    add_edge_model: true
    add_global_model: false
    x_encoding:
    - name: prev_contribution
      n_levels: 21
      encoding: numeric
    - name: prev_punishment
      n_levels: 31
      encoding: numeric
    - name: agent_group
      n_levels: 2
      encoding: onehot
    - name: own_grp_prev_mean_contr
      etype: float
      norm: 20
  optimizer_args:
    lr: 0.0003
    weight_decay: 1.0e-05
  train_args:
    epochs: 575
    batch_size: 4
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
    switch_weight: 9
  device: cuda
  autoregression: false
