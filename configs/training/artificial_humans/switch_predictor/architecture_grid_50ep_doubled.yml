description: >-
  Architecture x feature grid for the switch predictor on the doubled
  50-episode group-switching data (16 runs = 4 architectures x 4 feature
  levels), mirroring the contribution grid. Architectures: node MLP / rnn
  / edge / edge+rnn. Feature ladder (cumulative): cg = prev_common_good;
  cgp = + prev_punishment; cgpg = + prev_agent_group (onehot); cgpgr =
  + round_number. Run labels combine both as <arch>_<feat>. Tuned
  hyperparameters from opt_50ep_doubled kept (hidden=10, lr=5e-4,
  wd=1e-3, mask=switch_valid); 2000 epochs across the board (best epoch
  reported per run). Analyse via wandb (fetch_wandb_grid.py) -- the local
  parquet baseline is unreliable for multi-shuffle runs. Launch with:
  scripts/train_cluster.sh ah configs/training/artificial_humans/switch_predictor/architecture_grid_50ep_doubled.yml
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: switch_valid
  switch_every: 4
  experiment_names: [ah_group_switching]
  labels:
    architecture: edge+rnn_cgpgr
    dataset: 50ep_doubled
    epochs: 2000
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features: []
  basedir: .
  output_dir: artifacts/artificial_humans/switch_architecture_grid_50ep_doubled
  model_args:
    y_levels: 2
    y_name: does_switch
    hidden_size: 10
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - etype: float
        name: prev_common_good
        norm: 20
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - name: prev_agent_group
        n_levels: 2
        encoding: onehot
      - name: round_number
        n_levels: 24
        encoding: numeric
  optimizer_args:
    lr: 5.e-4
    weight_decay: 1.e-3
  train_args:
    epochs: 2000
    batch_size: 10
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: False
grid:
  # 16 runs: 4 architectures x 4 cumulative feature levels.
  # cg=common_good, p=+punishment, g=+agent_group(oh), r=+round_number.
  # Two zipped sub-dimensions crossed: architecture x feature-level.
  - labels.architecture:
      [node_cg, node_cgp, node_cgpg, node_cgpgr,
       rnn_cg, rnn_cgp, rnn_cgpg, rnn_cgpgr,
       edge_cg, edge_cgp, edge_cgpg, edge_cgpgr,
       "edge+rnn_cg", "edge+rnn_cgp", "edge+rnn_cgpg", "edge+rnn_cgpgr"]
    model_args.add_rnn:
      [false, false, false, false,
       true, true, true, true,
       false, false, false, false,
       true, true, true, true]
    model_args.add_edge_model:
      [false, false, false, false,
       false, false, false, false,
       true, true, true, true,
       true, true, true, true]
    model_args.x_encoding:
      # node
      - [{etype: float, name: prev_common_good, norm: 20}]
      - [{etype: float, name: prev_common_good, norm: 20},
         {name: prev_punishment, n_levels: 31, encoding: numeric}]
      - [{etype: float, name: prev_common_good, norm: 20},
         {name: prev_punishment, n_levels: 31, encoding: numeric},
         {name: prev_agent_group, n_levels: 2, encoding: onehot}]
      - [{etype: float, name: prev_common_good, norm: 20},
         {name: prev_punishment, n_levels: 31, encoding: numeric},
         {name: prev_agent_group, n_levels: 2, encoding: onehot},
         {name: round_number, n_levels: 24, encoding: numeric}]
      # rnn
      - [{etype: float, name: prev_common_good, norm: 20}]
      - [{etype: float, name: prev_common_good, norm: 20},
         {name: prev_punishment, n_levels: 31, encoding: numeric}]
      - [{etype: float, name: prev_common_good, norm: 20},
         {name: prev_punishment, n_levels: 31, encoding: numeric},
         {name: prev_agent_group, n_levels: 2, encoding: onehot}]
      - [{etype: float, name: prev_common_good, norm: 20},
         {name: prev_punishment, n_levels: 31, encoding: numeric},
         {name: prev_agent_group, n_levels: 2, encoding: onehot},
         {name: round_number, n_levels: 24, encoding: numeric}]
      # edge
      - [{etype: float, name: prev_common_good, norm: 20}]
      - [{etype: float, name: prev_common_good, norm: 20},
         {name: prev_punishment, n_levels: 31, encoding: numeric}]
      - [{etype: float, name: prev_common_good, norm: 20},
         {name: prev_punishment, n_levels: 31, encoding: numeric},
         {name: prev_agent_group, n_levels: 2, encoding: onehot}]
      - [{etype: float, name: prev_common_good, norm: 20},
         {name: prev_punishment, n_levels: 31, encoding: numeric},
         {name: prev_agent_group, n_levels: 2, encoding: onehot},
         {name: round_number, n_levels: 24, encoding: numeric}]
      # edge+rnn
      - [{etype: float, name: prev_common_good, norm: 20}]
      - [{etype: float, name: prev_common_good, norm: 20},
         {name: prev_punishment, n_levels: 31, encoding: numeric}]
      - [{etype: float, name: prev_common_good, norm: 20},
         {name: prev_punishment, n_levels: 31, encoding: numeric},
         {name: prev_agent_group, n_levels: 2, encoding: onehot}]
      - [{etype: float, name: prev_common_good, norm: 20},
         {name: prev_punishment, n_levels: 31, encoding: numeric},
         {name: prev_agent_group, n_levels: 2, encoding: onehot},
         {name: round_number, n_levels: 24, encoding: numeric}]
