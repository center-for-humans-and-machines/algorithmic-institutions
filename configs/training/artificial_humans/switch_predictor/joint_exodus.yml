description: >-
  Switch predictor with the JOINT EXODUS head: a round-level joint over the
  pair of leaver counts (m_0, m_1), fitted by cross-entropy alongside the
  unchanged per-agent loss as a detached readout. See
  notes/autoresearch_log/switch-joint-exodus-gmlp.md. Every hyperparameter is
  copied verbatim from opt_50ep_doubled_reanchored.yml (375 epochs, batch 10,
  lr 5.e-4, hidden 10, 5-fold, seed 38381, flip-doubled data) -- this tests a
  mechanism, not a tuning. The only differences are model_args.joint_exodus
  (the gate), model_args.joint_exodus_switch_every (which rounds the
  simulation's joint draw fires on -- the same 4 as the params-level
  switch_every this run's decision rounds already come from; it does not
  enter training, it is persisted into the artifact for the simulation-time
  sampler) and output_dir (this experiment's slug, so runs cannot collide on
  paths).
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: switch_valid
  switch_every: 4
  experiment_names: [ah_group_switching]
  labels:
    architecture: mlp+rnn+edge
    dataset: 50ep_doubled
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features:
    [common_good, punishment, agent_group, round_number]
  basedir: .
  output_dir: artifacts/artificial_humans/switch_joint_exodus_gmlp
  model_args:
    y_levels: 2
    y_name: does_switch
    hidden_size: 10
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    joint_exodus: True
    joint_exodus_switch_every: 4
    x_encoding:
      - etype: float
        name: common_good
        norm: 20
      - name: punishment
        n_levels: 31
        encoding: numeric
      - name: agent_group
        n_levels: 2
        encoding: numeric
      - name: round_number
        n_levels: 24
        encoding: numeric
  optimizer_args:
    lr: 5.e-4
    weight_decay: 1.e-3
  train_args:
    epochs: 375
    batch_size: 10
    eval_period: 5
    l1_entropy: 0
  device: cuda
  autoregression: False
