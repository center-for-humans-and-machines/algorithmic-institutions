description: >-
  Joint exodus head with the decision-round index ONE-HOT encoded over the 5
  decision rounds, instead of the scalar r / 23. At decision rounds r / 23
  takes exactly 5 distinct values, so this is a bijective re-encoding of an
  input the head already has -- no new observable and no new information,
  only a different inductive bias (5 free logit offsets instead of one shared
  direction in r). Every hyperparameter is copied verbatim from
  joint_exodus.yml -- this tests a mechanism, not a tuning. The only
  differences are model_args.joint_exodus_round_onehot (the gate, giving the
  number of decision-round slots) and output_dir (this experiment's slug, so
  runs cannot collide on paths). See notes/autoresearch_log/switch-round-onehot.md.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: switch_valid
  switch_every: 4
  experiment_names: [ah_group_switching]
  labels:
    architecture: mlp+rnn+edge
    dataset: 50ep_doubled
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features:
    [common_good, punishment, agent_group, round_number]
  basedir: .
  output_dir: artifacts/artificial_humans/switch_joint_exodus_round_onehot
  model_args:
    y_levels: 2
    y_name: does_switch
    hidden_size: 10
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    joint_exodus: True
    joint_exodus_switch_every: 4
    joint_exodus_round_onehot: 5
    x_encoding:
      - etype: float
        name: common_good
        norm: 20
      - name: punishment
        n_levels: 31
        encoding: numeric
      - name: agent_group
        n_levels: 2
        encoding: numeric
      - name: round_number
        n_levels: 24
        encoding: numeric
  optimizer_args:
    lr: 5.e-4
    weight_decay: 1.e-3
  train_args:
    epochs: 375
    batch_size: 10
    eval_period: 5
    l1_entropy: 0
  device: cuda
  autoregression: False
