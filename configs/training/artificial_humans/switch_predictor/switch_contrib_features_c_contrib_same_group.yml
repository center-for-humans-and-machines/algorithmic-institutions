description: >-
  Arm C of the switch contribution-feature sweep: contribution node feature
  plus the same_group edge feature. Group-aware routing of contributions lets
  the agent tell which group is worse, making the founding exodus directional.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: switch_valid
  switch_every: 4
  experiment_names: [ah_group_switching]
  labels:
    architecture: mlp+rnn+edge
    dataset: 50ep_doubled
    features: c_contrib_same_group
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features:
    [common_good, punishment, agent_group, round_number, contribution]
  basedir: .
  output_dir: artifacts/artificial_humans/switch_contrib_features_c_contrib_same_group
  model_args:
    y_levels: 2
    y_name: does_switch
    hidden_size: 10
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - etype: float
        name: common_good
        norm: 20
      - name: punishment
        n_levels: 31
        encoding: numeric
      - name: agent_group
        n_levels: 2
        encoding: numeric
      - name: round_number
        n_levels: 24
        encoding: numeric
      - name: contribution
        n_levels: 21
        encoding: numeric
    edge_encoding:
      - name: same_group
        etype: bool
  optimizer_args:
    lr: 5.e-4
    weight_decay: 1.e-3
  train_args:
    epochs: 375
    batch_size: 10
    eval_period: 5
    l1_entropy: 0
  device: cuda
  autoregression: False
