description: >-
  Optimised switch predictor. Starts from the grid_search.yml winner
  (mlp+rnn+edge, hidden_size=20, lr=3e-3) and adds add_global_model=True
  based on grid_search_v2.yml, which lifted mean test log-loss from
  0.529 to 0.520 (8-fold CV) and accuracy from 0.723 to 0.750. v2 also
  ruled out weight_decay and l1_entropy as net-zero levers and showed
  hidden_size=40 overfits earlier without improving test loss.
  Epochs capped at 75 -- best_epoch_mean was ~79, so we stop just before
  the test-loss plateau starts drifting up.
  Note: round_number is kept despite ~0 shuffle/ablate deltas; an
  earlier attempt to drop it degraded test log-loss to 0.569 and switch
  recall to 15%. Mean-imputation and permutation both preserve the value
  distribution of a position variable, so neither perturbation destroys
  its signal reliably -- the importance methods under-rate it.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: switch_mask
  switch_every: 4
  experiment_names: [ah_group_switching]
  labels:
    architecture: mlp+rnn+edge
    dataset: feat
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 8
  n_player: 8
  n_groups: 2
  data_file: experiments/group_switching_human_human_group_switching_8_agents.csv
  model_name: graph
  shuffle_features:
    - prev_contribution
    - prev_common_good
    - prev_punishment
    - agent_group
    - prev_does_switch
    - prev_contribution_valid
    - round_number
  ablate_features:
    - prev_contribution
    - prev_common_good
    - prev_punishment
    - agent_group
    - prev_does_switch
    - prev_contribution_valid
    - round_number
  basedir: .
  output_dir: artifacts/artificial_humans/switch_pred_opt
  model_args:
    y_levels: 2
    y_name: does_switch
    hidden_size: 20
    add_rnn: True
    add_edge_model: True
    add_global_model: True
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - etype: float
        name: prev_common_good
        norm: 20
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - name: agent_group
        n_levels: 2
        encoding: numeric
      - etype: bool
        name: prev_does_switch
      - etype: bool
        name: prev_contribution_valid
      - name: round_number
        n_levels: 24
        encoding: numeric
  optimizer_args:
    lr: 3.e-3
  train_args:
    epochs: 75
    batch_size: 10
    eval_period: 5
    l1_entropy: 0
  device: cuda
  autoregression: False
