description: >-
  Grid over add_global_model x weight_decay x lr for the 35-episode
  switch predictor. Architecture mlp+rnn+edge, hidden_size=20, trimmed
  features (prev_common_good, prev_punishment, agent_group). 5-fold CV,
  500 epochs so the effective plateau is readable. Aim: test whether
  the global-pool head improves group-switching dynamics in sim by
  letting each agent condition on the full-episode aggregate.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: switch_mask
  switch_every: 4
  experiment_names: [ah_group_switching]
  labels:
    architecture: mlp+rnn+edge
    dataset: 35ep
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_35ep.csv
  model_name: graph
  basedir: .
  output_dir: artifacts/artificial_humans/switch_pred_grid_search_35ep
  model_args:
    y_levels: 2
    y_name: does_switch
    hidden_size: 20
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - etype: float
        name: prev_common_good
        norm: 20
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - name: agent_group
        n_levels: 2
        encoding: numeric
  optimizer_args:
    lr: 1.e-3
    weight_decay: 1.e-3
  train_args:
    epochs: 500
    batch_size: 10
    eval_period: 5
    l1_entropy: 0
  device: cuda
  autoregression: False
grid:
  - model_args.add_global_model: [false, true]
    labels.global: ['off', 'on']
  - optimizer_args.weight_decay: [1.e-3, 3.e-3]
    labels.wd: ['1e-3', '3e-3']
  - optimizer_args.lr: [1.e-3, 3.e-4]
    labels.lr: ['1e-3', '3e-4']
