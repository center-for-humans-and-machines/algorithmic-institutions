description: >-
  Punishment predictor retrained on the pair-augmented (doubled) 50ep
  dataset. Simplified vs autoregressive_50ep.yml: dropped autoregression
  + agent_group + autoreg-mask features, kept the RNN. Features are now
  just (prev_contribution, prev_punishment, is_first). Train log-loss
  comparison against the legacy autoreg model is the headline.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 8
  memory: 32
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: punishment_valid
  switch_every: 4
  experiment_names: [ah_group_switching]
  labels:
    architecture: node+edge+rnn
    dataset: 50ep_doubled
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features: []
  basedir: .
  output_dir: artifacts/artificial_humans/punishment_rnn_edge_50ep_doubled
  model_args:
    y_levels: 31
    y_name: punishment
    hidden_size: 20
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - etype: bool
        name: is_first
  optimizer_args:
    lr: 1.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 1250
    batch_size: 10
    clamp_grad: 1
    eval_period: 10
    l1_entropy: 0
  device: cuda
  autoregression: false
