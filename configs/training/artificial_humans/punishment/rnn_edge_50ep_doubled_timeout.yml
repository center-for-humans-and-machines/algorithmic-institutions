description: >-
  Punishment predictor on the pair-augmented (doubled) 50ep dataset, as
  rnn_edge_50ep_doubled_ceiling.yml (node+edge+rnn, hidden 20, no
  autoregression, no agent_group, the current round's `contribution`
  numeric plus the `contribution_max` ceiling bool) with a bool node
  feature `contribution_valid` (the player gave input this round). 558 of
  the punisher's training rows are players who timed out: the game charged
  them 0 and the manager never punished a single one of them, while
  players who chose 0 were punished 43.5% of the time. Without the flag
  both populations read `contribution = 0` and the model averages them.
  The RL manager already observes `contribution_valid`
  (configs/training/rl_manager/03_2g8a_sum.yml); this brings the
  artificial punisher in line with the manager it stands in for. Features
  are (contribution, contribution_max, contribution_valid,
  prev_contribution, prev_punishment, is_first). See
  notes/autoresearch_log/punisher-timeout-feature.md.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 8
  memory: 32
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: punishment_valid
  switch_every: 4
  experiment_names: [ah_group_switching]
  labels:
    architecture: node+edge+rnn
    dataset: 50ep_doubled
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features: []
  basedir: .
  output_dir: artifacts/artificial_humans/punishment/rnn_edge_50ep_doubled_timeout
  model_args:
    y_levels: 31
    y_name: punishment
    hidden_size: 20
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - name: contribution
        n_levels: 21
        encoding: numeric
      - etype: bool
        name: contribution_max
      - etype: bool
        name: contribution_valid
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - etype: bool
        name: is_first
  optimizer_args:
    lr: 1.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 1250
    batch_size: 10
    clamp_grad: 1
    eval_period: 10
    l1_entropy: 0
  device: cuda
  autoregression: false
