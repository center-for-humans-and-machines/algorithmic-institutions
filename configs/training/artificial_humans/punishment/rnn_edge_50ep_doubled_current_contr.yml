description: >-
  Punishment predictor on the pair-augmented (doubled) 50ep dataset, as
  rnn_edge_50ep_doubled.yml (node+edge+rnn, hidden 20, no autoregression,
  no agent_group) with the current round's `contribution` added to the
  node features: the human manager punishes round t's contribution, not
  round t-1's (corr(p_t, c_t) = -0.28 vs corr(p_t, c_{t-1}) = -0.19), and
  the lagged-only punisher could not reproduce that response. Features are
  (contribution, prev_contribution, prev_punishment, is_first). See
  notes/autoresearch_log/punisher-current-contribution.md.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 8
  memory: 32
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: punishment_valid
  switch_every: 4
  experiment_names: [ah_group_switching]
  labels:
    architecture: node+edge+rnn
    dataset: 50ep_doubled
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_50ep.csv
  model_name: graph
  shuffle_features: []
  basedir: .
  output_dir: artifacts/artificial_humans/punishment/rnn_edge_50ep_doubled_current_contr
  model_args:
    y_levels: 31
    y_name: punishment
    hidden_size: 20
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - name: contribution
        n_levels: 21
        encoding: numeric
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - etype: bool
        name: is_first
  optimizer_args:
    lr: 1.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 1250
    batch_size: 10
    clamp_grad: 1
    eval_period: 10
    l1_entropy: 0
  device: cuda
  autoregression: false
