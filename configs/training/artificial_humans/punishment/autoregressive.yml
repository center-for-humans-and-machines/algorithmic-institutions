description: >-
  Train autoregressive punishment predictor on the 35-episode group
  switching data. Best grid-search config compatible with autoregressive
  inference (predict_autoreg requires no RNN): node+edge, hidden=20,
  best test log-loss 0.801 +/- 0.264 at ep ~4800. batch_size=7 so 28
  train episodes per fold divide cleanly. 5000 epochs covers the slowest
  folds which are still climbing at the end of the grid-search window.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 8
  memory: 32
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: recorded
  switch_every: 4
  experiment_names: [ah_group_switching]
  labels:
    architecture: node+edge+autoregressive
    dataset: 35ep
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_35ep.csv
  model_name: graph
  shuffle_features: []
  basedir: .
  output_dir: artifacts/artificial_humans/punishment_autoregressive
  model_args:
    y_levels: 31
    y_name: punishment
    hidden_size: 20
    add_rnn: False
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - name: punishment_masked
        n_levels: 31
        encoding: numeric
      - name: agent_group
        n_levels: 2
        encoding: numeric
      - etype: bool
        name: prev_contribution_valid
      - etype: bool
        name: prev_punishment_valid
      - etype: bool
        name: autoreg_mask
      - etype: bool
        name: is_first
  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 5000
    batch_size: 7
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: true
  min_predicted: 1
  max_predicted: 8
