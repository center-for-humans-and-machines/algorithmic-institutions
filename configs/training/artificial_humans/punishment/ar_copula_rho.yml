description: >-
  Severity-copula calibration for the AR-GNN punisher (auto/punisher-ar-copula,
  plan step 9-11). Not a training run: the job estimates `copula_rho` against
  the 2750-epoch AR checkpoint's own conditional CDFs on the full flip-doubled
  training data and writes a copy of that checkpoint carrying `copula_rho` and
  nothing else. It rides the documented `train_cluster.sh ah` path (R6) --
  `run_training.sh` requests a GPU, which the job simply does not use; `device:
  cpu` is pinned for determinism. The estimator, the 200-resample pair_id
  bootstrap, the round-trip acceptance gate (`--roundtrip`, non-zero exit on
  failure) and the pre-flight group-spread table (`--preflight`) all live in
  scripts/artificial_humans/punishment_ar_copula_rho.py.
exec:
  command: python scripts/artificial_humans/punishment_ar_copula_rho.py {job_file} --roundtrip --preflight
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 8
  memory: 32
params_only: true
params:
  labels:
    architecture: node+edge+rnn+ar+copula
    dataset: 50ep_doubled
    epochs: 2750
  device: cpu
  seed: 38381
  basedir: .
  data_file: experiments/2group_8agent_50ep.csv
  experiment_names: [ah_group_switching]
  switch_every: 4
  mask_name: punishment_valid
  y_name: punishment
  n_cross_val: 5
  n_reveal_replicates: 8
  n_bootstrap: 200
  source_model: artifacts/artificial_humans/punishment_ar_gnn_50ep_doubled/model/architecture_node+edge+rnn+ar__dataset_50ep_doubled__epochs_2750.pt
  source_md5: 4774e934f08a96da01da875851ad7a2c
  output_dir: artifacts/artificial_humans/punishment_ar_gnn_copula_50ep_doubled
  edge_encoding:
    - name: ar_punishment
      n_levels: 31
