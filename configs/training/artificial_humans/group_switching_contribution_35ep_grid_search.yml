description: >-
  Grid search for contribution predictor on the 35-episode dataset.
  Sweeps architecture variants (node+rnn, node+edge+rnn,
  node+edge+rnn+global) and hidden_size (5, 10, 20) with lr fixed at
  3e-4. 5-fold cross-validation.
exec:
  command: python -m aimanager train-ah {job_file}
  script_name: run_training
  data_dir: artifacts
  temp_dir: .log
  cores: 4
  memory: 8
params_only: true
params:
  fraction_training: 1.0
  seed: 38381
  mask_name: contribution_valid
  experiment_names: [ah_group_switching]
  labels:
    dataset: 35ep
  n_contributions: 21
  n_punishments: 31
  n_cross_val: 5
  n_player: 8
  n_groups: 2
  data_file: experiments/2group_8agent_35ep.csv
  model_name: graph
  shuffle_features:
    - prev_contribution
    - prev_punishment
    - agent_group
    - round_number
  basedir: .
  output_dir: artifacts/artificial_humans/group_switching_contribution_35ep_grid_search
  model_args:
    y_levels: 21
    y_name: contribution
    hidden_size: 10
    add_rnn: True
    add_edge_model: True
    add_global_model: False
    x_encoding:
      - name: prev_contribution
        n_levels: 21
        encoding: numeric
      - name: prev_punishment
        n_levels: 31
        encoding: numeric
      - name: agent_group
        n_levels: 2
        encoding: numeric
      - name: round_number
        n_levels: 24
        encoding: numeric
  optimizer_args:
    lr: 3.e-4
    weight_decay: 1.e-5
  train_args:
    epochs: 5000
    batch_size: 4
    clamp_grad: 1
    eval_period: 50
    l1_entropy: 0
  device: cuda
  autoregression: False
grid:
  - labels.architecture: [node+rnn, node+edge+rnn, node+edge+rnn+global]
    model_args.add_rnn: [true, true, true]
    model_args.add_edge_model: [false, true, true]
  - model_args.hidden_size: [5, 10, 20]
    labels.hidden_size: ['5', '10', '20']
