# XGBoost (multinomial softprob) contribution baseline -- same data protocol
# as cat.yml (single-copy train split, contribution_valid mask, 4 folds, seed
# 38381). Trees select features internally, so the block grid is lean (nested
# context sets) and the sweep lives in the hyperparameter grid instead.

data:
  data_file: experiments/baseline/2group_8agent_50ep_bline_train.csv
  experiment_names: [ah_group_switching]
  target: contribution
  target_type: categorical
  model: xgb
  categorical_levels: 21        # contribution is an integer 0..20
  mask: contribution_valid
  exclude_flipped: True
  switch_every: 4

cv:
  seed: 38381
  n_folds: 4
  output: data/baselines/contr_xgb.csv

setting:                        # griddable xgb knobs (Cartesian product)
  n_estimators: 300
  max_depth: [3, 5]
  learning_rate: [0.05, 0.1]
  min_child_weight: [1, 10, 30]
  subsample: 0.8
  reg_lambda: [1, 10]

blocks:
  B1_self:                      # own inertia + round-0 imputation flag
    components: [prev_contribution, prev_punishment, is_first]
    sets: [[prev_contribution, prev_punishment, is_first]]

  B2_context:                   # nested group-context sets, lean -> rich
    components: [prev_contribution_mean_group, prev_contribution_mean_other,
                 prev_punishment_mean_group, prev_common_good,
                 prev_group_size, prev_group_size_other, round_number,
                 prev_win_contribution_mean_group,
                 prev_win_punishment_mean_group, prev_win_common_good,
                 rounds_since_switch, switched_last_choice]
    sets:
      - [prev_contribution_mean_group, prev_contribution_mean_other]
      - [prev_contribution_mean_group, prev_contribution_mean_other,
         prev_punishment_mean_group, prev_common_good, prev_group_size,
         prev_group_size_other, round_number]
      - [prev_contribution_mean_group, prev_contribution_mean_other,
         prev_punishment_mean_group, prev_common_good, prev_group_size,
         prev_group_size_other, round_number,
         prev_win_contribution_mean_group, prev_win_punishment_mean_group,
         prev_win_common_good, rounds_since_switch, switched_last_choice]
