data:
  data_file: experiments/baseline/2group_8agent_50ep_bline_train.csv
  experiment_names: [ah_group_switching]
  target: contribution
  target_type: categorical
  categorical_levels: 21        # contribution is an integer 0..20
  mask: contribution_valid
  exclude_flipped: True
  switch_every: 4

cv:
  seed: 38381
  n_folds: 4
  output: data/baselines/contr_cat.csv

setting:              # multinomial logistic; only C is valid here
  C: 1.0

blocks:
  B1_self:                    # own inertia
    components: [prev_contribution, prev_punishment, prev_payoff]
    sets: [[prev_contribution, prev_punishment], [prev_contribution, prev_payoff]]

  B2_own_group:               # own group, self excluded (observational: t-1 roster of the CURRENT group id)
    components: [prev_contribution_mean_group, prev_punishment_mean_group, prev_payoff_mean_group, prev_group_size, prev_common_good]
    sets:    [[prev_contribution_mean_group, prev_punishment_mean_group, prev_group_size], [prev_payoff_mean_group, prev_group_size], [prev_common_good, prev_group_size], [prev_payoff_mean_group], [prev_common_good], [prev_contribution_mean_group, prev_group_size], [prev_contribution_mean_group]]
  
  B3_other_group:             # the other group
    components: [prev_contribution_mean_other, prev_punishment_mean_other, prev_common_good_other, prev_payoff_mean_other, prev_group_size_other]
    sets:    [[prev_contribution_mean_other, prev_punishment_mean_other, prev_group_size_other], [prev_payoff_mean_other, prev_group_size_other], [prev_common_good_other, prev_group_size_other], [prev_contribution_mean_other, prev_group_size_other], [prev_contribution_mean_other], [prev_payoff_mean_other], [prev_common_good_other]]

  B4_gap:                     # own - other
    components: [prev_contribution_mean_gap, prev_punishment_mean_gap, prev_common_good_gap, prev_payoff_mean_gap, prev_group_size_delta]
    sets:    [[prev_contribution_mean_gap, prev_punishment_mean_gap, prev_group_size_delta], [prev_payoff_mean_gap, prev_group_size_delta], [prev_common_good_gap, prev_group_size_delta], [prev_contribution_mean_gap, prev_group_size_delta], [prev_common_good_gap], [prev_payoff_mean_gap], [prev_group_size_delta]]

  B5_own_since_switch:        # own-group running mean over current tenure
    components: [win_contribution_mean_peers, win_punishment_mean_peers, win_common_good_peers, win_payoff_mean_peers]
    sets:    [[win_contribution_mean_peers, win_punishment_mean_peers], [win_payoff_mean_peers], [win_common_good_peers]]

  B7_structural:              
    components: [round_number, switched_last_choice, rounds_since_switch, group_size]
    sets: [[round_number, switched_last_choice, rounds_since_switch], [switched_last_choice, rounds_since_switch, group_size], [round_number], [switched_last_choice], [group_size]]