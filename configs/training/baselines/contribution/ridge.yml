data:
  # TRAIN split only (folds 1-4). The locked test fold lives in
  # experiments/baseline/2group_8agent_50ep_bline_test.csv and is NOT touched
  # during selection -- opened once, at the very end. See split_baseline_holdout.py.
  data_file: experiments/baseline/2group_8agent_50ep_bline_train.csv
  experiment_names: [ah_group_switching]
  target: contribution        # switch config sets: does_switch
  target_type: continuous    # categorical/continuous
  model: ridge                # ridge (fast MSE) shrinks the full grid; gaussian for the shortlist
  mask: contribution_valid    # switch config sets: switch_valid
  exclude_flipped: true       # train file is already undoubled; no-op safety filter
  switch_every: 4             # decision cadence

cv:
  seed: 38381
  n_folds: 8
  output: data/baselines/large_set_ridge_cv.csv          # the combination of reg param and feature set with its loss ordered from best to worst in csv format
  show_ce: true

# Hyper-parameter sweep for the chosen model; every key is griddable (scalar or
# list -> Cartesian). Allowed keys: ridge -> alpha; gaussian -> weight_decay, lr,
# epochs; multinomial -> C. A key that does not fit the model is an error.
setting:
  alpha: [1.0, 3.0]   # Ridge L2

blocks:
  B1_self:                    # own inertia
    components: [prev_contribution, prev_punishment, prev_payoff]
    sets: [[prev_contribution, prev_punishment], [prev_contribution, prev_payoff], [prev_contribution]]

  # Semantics per baseline_feature_defs.md: *_mean_group / *_other are
  # OBSERVATIONAL -- t-1 values over the t-1 roster of the CURRENT group ids,
  # so at an arrival round `group` is the joined group as observed before
  # joining. The switch grid uses the current (no-prefix) family (#123).
  B2_own_group:               # own group, self excluded
    components: [prev_contribution_mean_group, prev_punishment_mean_group, prev_payoff_mean_group, prev_group_size, prev_common_good]
    sets:    [[prev_contribution_mean_group, prev_punishment_mean_group, prev_group_size], [prev_contribution_mean_group, prev_group_size], [prev_contribution_mean_group], [prev_payoff_mean_group, prev_group_size], [prev_common_good, prev_group_size], [prev_payoff_mean_group], [prev_common_good]]

  B3_other_group:             # the other group
    components: [prev_contribution_mean_other, prev_punishment_mean_other, prev_common_good_other, prev_payoff_mean_other, prev_group_size_other]
    sets:    [[prev_contribution_mean_other, prev_punishment_mean_other, prev_group_size_other], [prev_payoff_mean_other, prev_group_size_other], [prev_common_good_other, prev_group_size_other], [prev_contribution_mean_other, prev_group_size_other], [prev_contribution_mean_other], [prev_payoff_mean_other], [prev_common_good_other]]

  B4_gap:                     # own - other
    components: [prev_contribution_mean_gap, prev_punishment_mean_gap, prev_common_good_gap, prev_payoff_mean_gap, prev_group_size_delta]
    sets:    [[prev_contribution_mean_gap, prev_punishment_mean_gap, prev_group_size_delta], [prev_payoff_mean_gap, prev_group_size_delta], [prev_common_good_gap, prev_group_size_delta], [prev_contribution_mean_gap, prev_group_size_delta], [prev_common_good_gap], [prev_payoff_mean_gap], [prev_group_size_delta]]

  B5_own_since_switch:        # own-group window as of t-1 (tenure mean of the prev-observed series)
    components: [prev_win_contribution_mean_group, prev_win_punishment_mean_group, prev_win_common_good, prev_win_payoff_mean_group]
    sets:    [[prev_win_contribution_mean_group, prev_win_punishment_mean_group], [prev_win_payoff_mean_group], [prev_win_common_good]]

  B6_other_since_switch:      # other-group window as of t-1
    components: [prev_win_contribution_mean_other, prev_win_punishment_mean_other, prev_win_common_good_other, prev_win_payoff_mean_other]
    sets:    [[prev_win_contribution_mean_other, prev_win_punishment_mean_other], [prev_win_common_good_other], [prev_win_payoff_mean_other]]

  B7_structural:              
    components: [round_number, switched_last_choice, rounds_since_switch, group_size]
    sets: [[round_number, switched_last_choice, rounds_since_switch], [switched_last_choice, rounds_since_switch, group_size], [round_number], [switched_last_choice], [group_size]]