# MLP shortlist for the contribution baseline: does a nonlinear conditional mean
# beat the linear one on the SAME feature sets? Scored by MSE, so it is directly
# comparable to the ridge grid (same metric, same folds, same seed).
#
# This is a SHORTLIST, not a block grid: a single block carries the four
# candidate feature sets as alternatives, so the enumerator emits exactly those
# four (plus its implicit intercept-only floor) rather than a Cartesian product.

data:
  # TRAIN split only (folds 1-4). The locked test fold lives in
  # experiments/baseline/2group_8agent_50ep_bline_test.csv and is NOT touched
  # during selection -- opened once, at the very end.
  data_file: experiments/baseline/2group_8agent_50ep_bline_train.csv
  experiment_names: [ah_group_switching]
  target: contribution
  target_type: continuous
  model: mlp                  # single-hidden-layer tanh point regressor (MSE)
  mask: contribution_valid
  exclude_flipped: true       # train file is already undoubled; no-op safety filter
  switch_every: 4             # decision cadence

cv:
  seed: 38381
  n_folds: 4                  # shortlist convention (matches gaussian.yml)
  output: data/baselines/contribution_mlp_cv.csv
  show_ce: false              # point model: no predictive density to bin

# 3 x 3 x 3 x 3 = 81 settings; allowed mlp keys: hidden, lr, epochs, weight_decay.
setting:
  hidden: [8, 16, 32]
  lr: [0.01, 0.05, 0.1]
  epochs: [200, 500, 1000]
  weight_decay: [0.0, 0.0001, 0.001]

blocks:
  # One block, four mutually exclusive candidate sets (+ implicit OFF = floor):
  #   s0  ridge rank-1        (9 features, best linear MSE set)
  #   s1  gaussian rank-1    (12 features, best NLL set)
  #   s2  lean                (5 features, minimal inertia + own group)
  #   s3  lean + structure    (7 features, adds the switch counters)
  B1_shortlist:
    components: [prev_contribution, prev_punishment, prev_payoff, prev_contribution_mean_group, prev_punishment_mean_group, prev_group_size, prev_payoff_mean_other, prev_payoff_mean_gap, prev_group_size_delta, prev_win_common_good, prev_win_payoff_mean_other, round_number, switched_last_choice, rounds_since_switch, group_size]
    sets:
      - [prev_contribution, prev_payoff, prev_contribution_mean_group, prev_punishment_mean_group, prev_group_size, prev_payoff_mean_other, prev_payoff_mean_gap, prev_win_common_good, prev_win_payoff_mean_other]
      - [prev_contribution, prev_punishment, prev_contribution_mean_group, prev_punishment_mean_group, prev_group_size, prev_payoff_mean_other, prev_payoff_mean_gap, prev_group_size_delta, prev_win_common_good, switched_last_choice, rounds_since_switch, group_size]
      - [prev_contribution, prev_punishment, prev_contribution_mean_group, prev_group_size, round_number]
      - [prev_contribution, prev_punishment, prev_contribution_mean_group, prev_punishment_mean_group, prev_group_size, switched_last_choice, rounds_since_switch]
