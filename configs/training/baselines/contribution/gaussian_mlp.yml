# gaussian_mlp feature shortlist for the contribution slot
# (notes/autoresearch_log/contribution-gaussian-mlp.md, step 6).
#
# Generated by:
#   .venv/bin/python scripts/baselines/make_shortlist_config.py \
#       data/baselines/gaussian_top500_feats.csv --top-n 3 \
#       --source-config configs/training/baselines/contribution/gaussian.yml \
#       --model gaussian_mlp --set hidden=16,32,64 --set lr=0.01,0.05 \
#       --set epochs=500 --set weight_decay=0.0,0.0001 \
#       --out configs/training/baselines/contribution/gaussian_mlp.yml
#
# then hand-trimmed: B7_structural dropped the round_number variant (gaussian
# s0), which --top-n 3 pulled in via the rank-3 row only. What survives is
# exactly the set combination carrying the top gaussian CV rows -- rank 1 is
# B1_self:s0 + B2_own_group:s0 + B3_other_group:s5 + B4_gap:s1 +
# B5_own_since_switch:s2 + B7_structural:s1 (nll 2.7135, ce 2.4450) -- plus
# B1_self:s1 (prev_payoff instead of prev_punishment), the one own-inertia
# alternative worth re-ranking under a nonlinear head. Set indices in the block
# comments below are the gaussian.yml ones, which is what the CSV's `config`
# labels refer to.
#
# With the implicit OFF per block this enumerates 3*2*2*2*2*2 = 96 feature sets;
# the setting grid is 3 hidden x 2 lr x 1 epochs x 2 weight_decay = 12, so
# 96 x 12 x 4 folds = 4,608 fold fits (~5-10 min locally on 9 workers).

data:
  data_file: experiments/baseline/2group_8agent_50ep_bline_train.csv
  experiment_names: [ah_group_switching]
  target: contribution
  target_type: continuous
  mask: contribution_valid
  exclude_flipped: True
  switch_every: 4
  model: gaussian_mlp

cv:
  seed: 38381
  n_folds: 4
  output: data/baselines/gaussian_mlp_cv.csv
  show_ce: true          # binned 21-way cross-entropy alongside NLL

setting:               # gaussian_mlp knobs; every key griddable (scalar|list)
  hidden: [16, 32, 64]
  weight_decay: [0.0, 0.0001]
  lr: [0.01, 0.05]
  epochs: 500

blocks:
  B1_self:                    # gaussian s0, s1
    components: [prev_contribution, prev_punishment, prev_payoff]
    sets: [[prev_contribution, prev_punishment], [prev_contribution, prev_payoff]]

  B2_own_group:               # gaussian s0
    components: [prev_contribution_mean_group, prev_punishment_mean_group,
                 prev_payoff_mean_group, prev_group_size, prev_common_good]
    sets: [[prev_contribution_mean_group, prev_punishment_mean_group,
            prev_group_size]]

  B3_other_group:             # gaussian s5
    components: [prev_contribution_mean_other, prev_punishment_mean_other,
                 prev_common_good_other, prev_payoff_mean_other,
                 prev_group_size_other]
    sets: [[prev_payoff_mean_other]]

  B4_gap:                     # gaussian s1
    components: [prev_contribution_mean_gap, prev_punishment_mean_gap,
                 prev_common_good_gap, prev_payoff_mean_gap,
                 prev_group_size_delta]
    sets: [[prev_payoff_mean_gap, prev_group_size_delta]]

  B5_own_since_switch:        # gaussian s2
    components: [prev_win_contribution_mean_group, prev_win_punishment_mean_group,
                 prev_win_common_good, prev_win_payoff_mean_group]
    sets: [[prev_win_common_good]]

  B7_structural:              # gaussian s1 (s0, the round_number variant, trimmed)
    components: [round_number, switched_last_choice, rounds_since_switch, group_size]
    sets: [[switched_last_choice, rounds_since_switch, group_size]]
