# SMOKE config (issue #119) — B1-B3 only, otherwise identical to handcrafted_grid.yml.
# Fast end-to-end check of run_baseline_cv.py: 3 x 4 x 4 = 48 feature-sets.

data:
  data_file: experiments/baseline/2group_8agent_50ep_bline_train.csv
  experiment_names: [ah_group_switching]
  target: contribution
  target_type: continuous
  mask: contribution_valid
  exclude_flipped: true
  switch_every: 4

cv:
  seed: 38381
  n_folds: 8
  output: data/baselines/smoke_cv_output_cont.csv

regularization:
  alpha: [3.0, 1.0, 0.3]

blocks:
  B1_self:                    # own inertia
    components: [prev_contribution, prev_punishment]
    sets: [[prev_contribution, prev_punishment], [prev_contribution]]

  B2_own_group:               # current group-mates, leave-one-out (cg omitted: = B1 prev_common_good)
    components: [prev_contribution_mean_peers, prev_punishment_mean_peers, prev_payoff_mean_group, prev_group_size, prev_common_good]
    sets:    [[prev_contribution_mean_peers, prev_punishment_mean_peers, prev_group_size], [prev_payoff_mean_group, prev_group_size], [prev_common_good, prev_group_size], [prev_contribution_mean_peers, prev_group_size], [prev_contribution_mean_peers]]
  
  B3_other_group:             # the other group
    components: [prev_contribution_mean_other, prev_punishment_mean_other, prev_common_good_mean_other, prev_payoff_mean_other, prev_group_size_other]
    sets:    [[prev_contribution_mean_other, prev_punishment_mean_other, prev_group_size_other], [prev_payoff_mean_other, prev_group_size_other], [prev_common_good_mean_other, prev_group_size_other], [prev_contribution_mean_other, prev_group_size_other], [prev_contribution_mean_other]]
  
  B7_structural:              
    components: [round_number, switched_last_choice, rounds_since_switch, group_size]
    sets: [[round_number, switched_last_choice, rounds_since_switch], [switched_last_choice, rounds_since_switch, group_size], [round_number], [switched_last_choice], [group_size]]
