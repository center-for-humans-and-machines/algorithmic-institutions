data:
  # TRAIN split only. Same locked split as contribution (episode-level; the mask
  # differs). Test fold lives in ../contribution's split test file and is NOT
  # touched here. See split_baseline_holdout.py.
  data_file: experiments/baseline/2group_8agent_50ep_bline_train.csv
  experiment_names: [ah_group_switching]
  target: does_switch
  target_type: categorical
  categorical_levels: 2         # does_switch is binary (0/1)
  mask: switch_valid            # decision rows only (needs switch_every)
  exclude_flipped: true         # train file is already undoubled; no-op safety filter
  switch_every: 4               # decision cadence -> sets switch_mask/switch_valid

cv:
  seed: 38381
  n_folds: 8
  output: data/baselines/switch_cv_output_cat.csv

setting:              # multinomial logistic; only C is valid here
  C: [0.3, 1.0, 3.0]

# ANCHORING (#123): does_switch[s] is the decision taken at the END of round s
# (rounds 3, 7, ... 0-indexed) -- the membership change materialises at s+1.
# Round-s outcomes are therefore fully observed before the decision, so the
# CURRENT (no-prefix) family is the natural, leak-free feature set here. The
# lag_* / prev_win_* twins that the old arrival-round anchoring required are
# gone. Semantics per notes/baseline_feature_defs.md.
blocks:
  B1_self:                    # own round-s outcome
    components: [contribution, punishment, payoff]
    sets: [[contribution, punishment], [contribution, payoff], [contribution]]

  B2_own_group:               # own group this round, self excluded
    components: [contribution_mean_group, punishment_mean_group, payoff_mean_group, group_size, common_good]
    sets:    [[contribution_mean_group, punishment_mean_group, group_size], [payoff_mean_group, group_size], [common_good, group_size], [payoff_mean_group], [common_good], [contribution_mean_group, group_size], [contribution_mean_group]]

  B3_other_group:             # the other group this round
    components: [contribution_mean_other, punishment_mean_other, common_good_other, payoff_mean_other, group_size_other]
    sets:    [[contribution_mean_other, punishment_mean_other, group_size_other], [payoff_mean_other, group_size_other], [common_good_other, group_size_other], [contribution_mean_other, group_size_other], [contribution_mean_other], [payoff_mean_other], [common_good_other]]

  B4_gap:                     # own - other
    components: [contribution_mean_gap, punishment_mean_gap, common_good_gap, payoff_mean_gap, group_size_delta]
    sets:    [[contribution_mean_gap, punishment_mean_gap, group_size_delta], [payoff_mean_gap, group_size_delta], [common_good_gap, group_size_delta], [contribution_mean_gap, group_size_delta], [common_good_gap], [payoff_mean_gap], [group_size_delta]]

  B5_own_since_switch:        # own-group tenure window through round s
    components: [win_contribution_mean_group, win_punishment_mean_group, win_common_good, win_payoff_mean_group]
    sets:    [[win_contribution_mean_group, win_punishment_mean_group], [win_payoff_mean_group], [win_common_good]]

  B6_other_since_switch:      # other-group tenure window through round s
    components: [win_contribution_mean_other, win_punishment_mean_other, win_common_good_other, win_payoff_mean_other]
    sets:    [[win_contribution_mean_other, win_punishment_mean_other], [win_common_good_other], [win_payoff_mean_other]]

  B7_structural:              # exogenous / past-decision context
    components: [round_number, switched_last_choice, rounds_since_switch]
    sets: [[round_number], [round_number, switched_last_choice], [switched_last_choice], [rounds_since_switch], [round_number, rounds_since_switch]]
