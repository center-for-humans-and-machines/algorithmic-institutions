data:
  # TRAIN split only. Same locked split as contribution/switch (episode-level;
  # the mask differs). Test fold lives in the _test sibling file and is NOT
  # touched here. See split_baseline_holdout.py.
  data_file: experiments/baseline/2group_8agent_50ep_bline_train.csv
  experiment_names: [ah_group_switching]
  target: punishment
  target_type: categorical
  categorical_levels: 31        # punishment is an integer 0..30
  mask: punishment_valid        # rounds where the manager gave input
  exclude_flipped: true         # train file is already undoubled; no-op safety filter
  switch_every: 4

cv:
  seed: 38381
  n_folds: 4
  output: data/baselines/punishment_cv_output_cat.csv

setting:              # multinomial logistic; only C is valid here
  C: 1.0

blocks:
  B1_self:                    # agent's inertia (GNN parity = prev_contribution, prev_punishment)
    components: [prev_contribution, prev_punishment, prev_payoff]
    sets: [[prev_contribution, prev_punishment], [prev_punishment]]

  B2_own_group:               # own group, self excluded (observational: t-1 roster of the CURRENT group id)
    components: [prev_contribution_mean_group, prev_punishment_mean_group, prev_payoff_mean_group, prev_group_size, prev_common_good]
    sets:    [[prev_contribution_mean_group, prev_punishment_mean_group, prev_group_size], [prev_payoff_mean_group, prev_group_size], [prev_common_good, prev_group_size], [prev_punishment_mean_group, prev_group_size], [prev_punishment_mean_group]]

  B3_other_group:             # the other group
    components: [prev_contribution_mean_other, prev_punishment_mean_other, prev_common_good_other, prev_payoff_mean_other, prev_group_size_other]
    sets:    [[prev_contribution_mean_other, prev_punishment_mean_other, prev_group_size_other], [prev_payoff_mean_other, prev_group_size_other], [prev_common_good_other, prev_group_size_other], [prev_punishment_mean_other, prev_group_size_other], [prev_punishment_mean_other]]

  B4_gap:                     # own - other
    components: [prev_contribution_mean_gap, prev_punishment_mean_gap, prev_common_good_gap, prev_payoff_mean_gap, prev_group_size_delta]
    sets:    [[prev_contribution_mean_gap, prev_punishment_mean_gap, prev_group_size_delta], [prev_payoff_mean_gap, prev_group_size_delta], [prev_common_good_gap, prev_group_size_delta], [prev_punishment_mean_gap, prev_group_size_delta], [prev_group_size_delta]]

  B5_own_since_switch:        # own-group window as of t-1
    components: [prev_win_contribution_mean_group, prev_win_punishment_mean_group, prev_win_common_good, prev_win_payoff_mean_group]
    sets:    [[prev_win_contribution_mean_group, prev_win_punishment_mean_group], [prev_win_payoff_mean_group], [prev_win_common_good]]

  B7_structural:              # is_first: round 0's prev_* are imputed medians (GNN parity)
    components: [round_number, switched_last_choice, rounds_since_switch, group_size, is_first]
    sets: [[round_number, is_first], [round_number, switched_last_choice, rounds_since_switch, is_first], [switched_last_choice, rounds_since_switch, group_size, is_first], [switched_last_choice], [group_size]]
