artificial_humans: artifacts/behavioral_cloning/21_contribution_model_v4/model/architecture_node+edge+rnn__dataset_full.pt
artificial_humans_valid: artifacts/behavioral_cloning/22_contribution_valid_model_v4/model/rnn_False__dataset_full.pt
artificial_humans_model: "graph"
job_id: raven_per_group
seed: 42


manager_args:
  opt_args:
      lr: 2.e-4
  gamma: 0.98
  eps: 0.1
  target_update_freq: 1000
  model_args:
      hidden_size: 100
      add_rnn: true
      add_edge_model: true
      add_global_model: False
      x_encoding:
        - name: contribution
          n_levels: 21
          encoding: numeric
        - name: prev_punishment
          n_levels: 31
          encoding: numeric
        - etype: bool
          name: contribution_valid
        - etype: bool
          name: in_group
      b_encoding:
        - name: round_number
          n_levels: 32
          encoding: onehot

replay_memory_args:
  n_episodes: 100

n_update_steps: 50000
eval_period: 20
training_batch_size: 1

env_args:
  n_groups: 2
  n_agents: 4
  n_contributions: 21
  n_punishments: 31
  n_rounds: 24
  batch_size: 1000

device: "cuda"
output_dir: "artifacts/manager/01_rnn_node_v3"
basedir: "."
