# #103 cell A: legacy baseline at the 15k single-job horizon.
# Matches the current 03_2g8a_sum.yml hyperparams (lr 2e-4, target_update_freq
# 1000) so the factorial has a comparable "before" curve. n_update_steps bumped
# from 4000 to 15000 -- the largest single-job horizon at the 2g8a per-step cost
# (see plan §1).

artificial_humans: artifacts/artificial_humans/group_switching_contribution_50ep/model/architecture_node+edge+rnn__dataset_50ep__epochs_575.pt
artificial_humans_valid: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
switch_model: artifacts/artificial_humans/switch_pred_opt_50ep_doubled/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt
opponent_manager: artifacts/artificial_humans/punishment_rnn_edge_50ep_doubled/model/architecture_node+edge+rnn__dataset_50ep_doubled.pt
artificial_humans_model: "graph"
job_id: 03_2g8a_sum_a_legacy
seed: 42

manager_args:
  opt_args:
      lr: 2.e-4
  gamma: 0.98
  eps: 0.1
  target_update_freq: 1000
  model_args:
      hidden_size: 100
      add_rnn: true
      add_edge_model: true
      add_global_model: False
      x_encoding:
        - name: contribution
          n_levels: 21
          encoding: numeric
        - name: prev_punishment
          n_levels: 31
          encoding: numeric
        - etype: bool
          name: contribution_valid
        - etype: bool
          name: in_group
      b_encoding:
        - name: round_number
          n_levels: 24
          encoding: onehot

replay_memory_args:
  n_episodes: 100

n_update_steps: 15000
eval_period: 20
training_batch_size: 1

env_args:
  n_groups: 2
  n_agents: 8
  agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
  rl_group_id: 0
  switch_every: 4
  n_contributions: 21
  n_punishments: 31
  n_rounds: 24
  batch_size: 1000
  reward_mode: sum

device: "cuda"
output_dir: "artifacts/manager/03_2g8a_sum_a_legacy"
basedir: "."
