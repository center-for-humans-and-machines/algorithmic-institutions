# The governor an exp2_diff sweep plays (docs/plans/archive/policy-finder-pool-difference.md):
# `ah`, as in the 25_LEVIN_run1 template, in both seats. The score is the rule's
# group's pool minus ah's group's pool in the same game. Unlike exp2_multi's, the
# key names the governor: agents of this setting know they play `ah`.
ah:
  name: ah
  description: the clone of a human governor (multinomial logistic regression, severity copula)
  manager:
    type: linear
    path: artifacts/baselines/punishment_multinomial_timeout_severity_copula.joblib
