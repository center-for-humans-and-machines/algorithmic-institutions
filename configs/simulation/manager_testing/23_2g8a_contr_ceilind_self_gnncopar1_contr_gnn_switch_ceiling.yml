# Contributor ceiling indicator (auto/contributor-ceiling-indicator), the
# gated run: the parent branch's frontier stack
# (23_2g8a_contr_stimulus_skip_self_gnncopar1_contr_gnn_switch_ceiling --
# stimulus-skip GNN contributor with its herding copula, joint-exodus GNN
# switch, ceiling-indicator lin_multinomial punisher) with the contributor
# slot swapped to the same trunk retrained with `prev_contribution_max`
# (copula-stamped copy, rho and phi carried frozen). Only the contributor
# path, output_dir and figure_name differ from the source config; protocol
# byte-identical. Source: origin/auto/punisher-ceiling-fix. The `_ceiling`
# suffix breaks evaluation_sweep.py's DIR_PATTERN on purpose -- these dirs
# are read by scripts/data_analysis/contributor_ceiling_table.py, not by the
# sweep.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep_vnode_stimulus_skip_ceilind_herding_copula/model/architecture_node+edge+rnn__dataset_50ep__epochs_575.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_joint_exodus/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_ceiling_severity_copula.joblib

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_contr_ceilind_self_gnncopar1_contr_gnn_switch_ceiling
figure_name: 2g8a_contr_ceilind_self_gnncopar1_contr_gnn_switch_ceiling
save_per_round: true
basedir: .
