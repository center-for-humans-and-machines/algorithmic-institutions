# Contributor ceiling indicator, state-spread diagnostic arm 2 (CANDIDATE,
# copula OFF): arm 1 with the contributor slot swapped to this branch's bare
# candidate trunk (the same trunk plus `prev_contribution_max`, copula_rho =
# 0). Everything else is byte-identical to arm 1, so the pair isolates the
# feature's effect on closed-loop state spread with the noise machinery
# disabled. Not evaluated; read by
# scripts/data_analysis/contributor_state_spread.py.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep_vnode_stimulus_skip_ceilind/model/architecture_node+edge+rnn__dataset_50ep__epochs_575.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_joint_exodus/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_ceiling_severity_copula.joblib

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_contr_ceilind_copoff_self_gnncopar1_contr_gnn_switch_ceiling
figure_name: 2g8a_contr_ceilind_copoff_self_gnncopar1_contr_gnn_switch_ceiling
save_per_round: true
basedir: .
