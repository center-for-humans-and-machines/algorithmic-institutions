# Issue #226, run 2 on the frontier stack (24_FRONTIER): rule-based managers
# (punish = clamp(floor((20 - contribution - round) / k), 0, 30), k=1
# harshest) against the AH and zero-punisher managers, symmetric pairings.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep_group_vnode_herding_copula/model/architecture_node+edge+rnn__dataset_50ep__epochs_575.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_joint_exodus/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  ah:
    type: linear
    path: artifacts/baselines/punishment_multinomial_current_contr_severity_copula.joblib
  zero:
    type: dummy
    constant_punishment: 0
  rule_k1:
    type: rule_based
    k: 1
  rule_k2:
    type: rule_based
    k: 2
  rule_k4:
    type: rule_based
    k: 4
  rule_k8:
    type: rule_based
    k: 8

pairings:
  - name: rule_k1_vs_ah
    group_0: rule_k1
    group_1: ah
  - name: ah_vs_rule_k1
    group_0: ah
    group_1: rule_k1
  - name: rule_k2_vs_ah
    group_0: rule_k2
    group_1: ah
  - name: ah_vs_rule_k2
    group_0: ah
    group_1: rule_k2
  - name: rule_k4_vs_ah
    group_0: rule_k4
    group_1: ah
  - name: ah_vs_rule_k4
    group_0: ah
    group_1: rule_k4
  - name: rule_k8_vs_ah
    group_0: rule_k8
    group_1: ah
  - name: ah_vs_rule_k8
    group_0: ah
    group_1: rule_k8
  - name: rule_k1_vs_zero
    group_0: rule_k1
    group_1: zero
  - name: zero_vs_rule_k1
    group_0: zero
    group_1: rule_k1
  - name: rule_k2_vs_zero
    group_0: rule_k2
    group_1: zero
  - name: zero_vs_rule_k2
    group_0: zero
    group_1: rule_k2
  - name: rule_k4_vs_zero
    group_0: rule_k4
    group_1: zero
  - name: zero_vs_rule_k4
    group_0: zero
    group_1: rule_k4
  - name: rule_k8_vs_zero
    group_0: rule_k8
    group_1: zero
  - name: zero_vs_rule_k8
    group_0: zero
    group_1: rule_k8

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

# Contribution recorded for a timed-out player: 0-20, or "default" (dataset
# median, also when absent). Training data records 0.
timeout_contribution: 0

output_dir: plots/simulation/25_FRONTIER_run2_rule_pairings
figure_name: FRONTIER_run2_rule_pairings
save_per_round: true
basedir: .
