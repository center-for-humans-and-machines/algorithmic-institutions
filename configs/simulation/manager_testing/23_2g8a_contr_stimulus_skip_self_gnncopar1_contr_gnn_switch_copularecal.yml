# contribution-copula-recalibrated, the gated frontier stack. Byte-identical
# to 23_2g8a_contr_stimulus_skip_self_gnncopar1_contr_gnn_switch_simtimeout.yml
# (the parent, PR for auto/sim-timeout-imputation) apart from output_dir,
# figure_name and the contributor artifact: SAME seed, SAME 100 episodes,
# SAME 24 rounds, SAME switch model, SAME punisher, SAME validity model.
# Nothing is retrained on this branch -- the contributor here is a copy of
# the same trunk with the REFITTED copula_rho stamped on it (copula_phi
# unchanged at 1.0, every weight bit-identical to the base).
# See notes/autoresearch_log/contribution-copula-recalibrated.md.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep_vnode_stimulus_skip_herding_copula_recal/model/architecture_node+edge+rnn__dataset_50ep__epochs_575.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_joint_exodus/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_timeout_severity_copula.joblib

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_contr_stimulus_skip_self_gnncopar1_contr_gnn_switch_copularecal
figure_name: 2g8a_contr_stimulus_skip_self_gnncopar1_contr_gnn_switch_copularecal
save_per_round: true
basedir: .
