# auto/switch-joint-exodus: the parent stack
# (23_2g8a_contr_herding_copula_v2_self_gnncopar1_contr_gnn_switch) with the
# switch slot swapped to the joint-exodus artifact -- the same GNN switch
# trunk, plus a round-level joint head over both groups' leaver counts and a
# conditional-Bernoulli draw for which members leave. Single pairing; protocol
# byte-identical to the parent. Slug sits before `_self_` so
# evaluation_sweep.py's DIR_PATTERN still parses contr/switch.
# ABLATION of the PR #179 candidate: the SAME group-vnode trunk, sampled
# WITHOUT the copula -- the unstamped step-7 artifact (sha256 714bf40b...)
# rather than the stamped one (379c2557...). The two artifacts' weights are
# bit-identical; they differ only in the three copula fields, so this isolates
# what the latent still contributes now that the trunk carries its own
# persistent per-group state. Recalibration put rho at 0.0436, down 37% from
# PR #165's 0.0696, and the closed-loop candidate slightly OVERSHOT human
# group spread (0.8512 vs 0.8480) -- hence the question. Protocol otherwise
# byte-identical to the PR #179 candidate: same switch model, same punisher,
# same single pairing, seed 42, 100 episodes, 24 rounds.
#
# Reported as an ablation, never as this experiment's claim (section 3 allows
# one simulation + one evaluation for the verdict, and that was the stamped
# candidate's).

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep_group_vnode/model/architecture_node+edge+rnn__dataset_50ep__epochs_575.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_joint_exodus/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_severity_copula.joblib

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_contr_group_vnode_nocopula_self_gnncopar1_contr_gnn_switch
figure_name: 2g8a_contr_group_vnode_nocopula_self_gnncopar1_contr_gnn_switch
save_per_round: true
basedir: .
