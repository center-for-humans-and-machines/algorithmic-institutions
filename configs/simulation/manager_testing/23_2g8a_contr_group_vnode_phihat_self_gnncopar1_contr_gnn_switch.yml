# ARCHIVED: the contribution artifact `group_switching_contribution_50ep_group_vnode_herding_copula_phihat` is not on
# autoresearch-optimized-stack; recover it from `origin/auto/contribution-group-vnode` to re-run.
# The run's outputs stay under plots/simulation/.
# auto/switch-joint-exodus: the parent stack
# (23_2g8a_contr_herding_copula_v2_self_gnncopar1_contr_gnn_switch) with the
# switch slot swapped to the joint-exodus artifact -- the same GNN switch
# trunk, plus a round-level joint head over both groups' leaver counts and a
# conditional-Bernoulli draw for which members leave. Single pairing; protocol
# byte-identical to the parent. Slug sits before `_self_` so
# evaluation_sweep.py's DIR_PATTERN still parses contr/switch.
# PHI-HAT VARIANT of the PR #179 candidate (maintainer-requested diagnostic,
# not the claim): the SAME group-vnode trunk and the SAME calibrated
# rho = 0.0435568043640977, but the latent stamped at the MEASURED
# phi_hat = 0.6182476558394783 instead of the unit-root boundary 1.0.
# Artifact 3ab685e1..., weights bit-identical to the trunk 714bf40b...
# Rationale: at phi = 1 the (episode, group) latent is frozen for all 24
# rounds regardless of membership, which overrides event-driven responses --
# the candidate carries the wrong SIGN on RCA's stayed_comp_changed stratum
# and is worst of the three on RCC. Protocol otherwise byte-identical.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep_group_vnode_herding_copula_phihat/model/architecture_node+edge+rnn__dataset_50ep__epochs_575.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_joint_exodus/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_severity_copula.joblib

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_contr_group_vnode_phihat_self_gnncopar1_contr_gnn_switch
figure_name: 2g8a_contr_group_vnode_phihat_self_gnncopar1_contr_gnn_switch
save_per_round: true
basedir: .
