# Issue #226, run 3 on Levin's stack (24_LEVIN), via #230's config-defined
# rules: Levin's fitted sigmoid rules (#219), opt_pool and best_cap10_pool,
# against the zero-punisher, the AH manager, each decay rule (k1/k2/k4/k8)
# and each other. One position per pairing (runs 1-2 showed no position
# effect). The decay rules load from configs/managers/rule_based/decay.yml.
#
# #232: the same sim with 1000 episodes per pairing, played in batches of 1000
# (the batched path makes 1000 episodes cheap; was 100, as in 25_LEVIN_run3_sigmoid_pairings).

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep_vnode_stimulus_skip_herding_copula/model/architecture_node+edge+rnn__dataset_50ep__epochs_575.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_joint_exodus/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  ah:
    type: linear
    path: artifacts/baselines/punishment_multinomial_timeout_severity_copula.joblib
  zero:
    type: dummy
    constant_punishment: 0
  rule_k1:
    type: rule_based
    rule: configs/managers/rule_based/decay.yml
    params: configs/managers/rule_based/params/decay_k1.json
  rule_k2:
    type: rule_based
    rule: configs/managers/rule_based/decay.yml
    params: configs/managers/rule_based/params/decay_k2.json
  rule_k4:
    type: rule_based
    rule: configs/managers/rule_based/decay.yml
    params: configs/managers/rule_based/params/decay_k4.json
  rule_k8:
    type: rule_based
    rule: configs/managers/rule_based/decay.yml
    params: configs/managers/rule_based/params/decay_k8.json
  opt_pool:
    type: rule_based
    rule: configs/managers/rule_based/sigmoid.yml
    params: configs/managers/rule_based/params/sigmoid_opt_pool.json
  best_cap10_pool:
    type: rule_based
    rule: configs/managers/rule_based/sigmoid.yml
    params: configs/managers/rule_based/params/sigmoid_best_cap10_pool.json

pairings:
  - name: opt_pool_vs_zero
    group_0: opt_pool
    group_1: zero
  - name: opt_pool_vs_ah
    group_0: opt_pool
    group_1: ah
  - name: opt_pool_vs_rule_k1
    group_0: opt_pool
    group_1: rule_k1
  - name: opt_pool_vs_rule_k2
    group_0: opt_pool
    group_1: rule_k2
  - name: opt_pool_vs_rule_k4
    group_0: opt_pool
    group_1: rule_k4
  - name: opt_pool_vs_rule_k8
    group_0: opt_pool
    group_1: rule_k8
  - name: best_cap10_pool_vs_zero
    group_0: best_cap10_pool
    group_1: zero
  - name: best_cap10_pool_vs_ah
    group_0: best_cap10_pool
    group_1: ah
  - name: best_cap10_pool_vs_rule_k1
    group_0: best_cap10_pool
    group_1: rule_k1
  - name: best_cap10_pool_vs_rule_k2
    group_0: best_cap10_pool
    group_1: rule_k2
  - name: best_cap10_pool_vs_rule_k4
    group_0: best_cap10_pool
    group_1: rule_k4
  - name: best_cap10_pool_vs_rule_k8
    group_0: best_cap10_pool
    group_1: rule_k8
  - name: opt_pool_vs_best_cap10_pool
    group_0: opt_pool
    group_1: best_cap10_pool

switch_every: 4
n_episode_steps: 24
n_episodes: 1000
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

# Contribution recorded for a timed-out player: 0-20, or "default" (dataset
# median, also when absent). Training data records 0.
timeout_contribution: 0

episode_batch_size: 1000

output_dir: plots/simulation/25_LEVIN_run3_sigmoid_pairings_batched
figure_name: LEVIN_run3_sigmoid_pairings_batched
save_per_round: true
basedir: .
