# auto/rule-inverted-targeting, seed 44.
#
# The learned RL managers came out INVERTED: they punish full contributors
# hardest and leave free-riders alone. An intervention probe established
# that the contributor model's targeting signal is real but weak, and that
# at the ceiling -- where two of three learned seeds aim -- the response is
# close to inert. That is a hypothesis about CONSEQUENCES: it says punishing
# the wrong people may be nearly free. This arm tests it by simulating an
# inverted manager rather than arguing from the probe.
#
# Run in the COMPETING setting, not self-play, because the parent branch
# established that self-play rankings do not survive competition (`prop10`
# went from +12.5 per seat in self-play to -15.6 against a live rival).
#
# Three focal rules against the same two rivals the paired arm used:
#   inv_thr11_p10  punish 10 on c >= 11   (level-matched mirror)
#   inv_thr7_p10   punish 10 on c >= 7    (spend-matched mirror)
#   thr9_p10       punish 10 on c <= 9    (the correctly-targeted rule)
#
# `thr9_p10` and `never` are re-run HERE rather than quoted from the parent,
# because MultiManager evaluates every manager in a file each round, so the
# RNG a run consumes depends on the file's manager SET (parent log, note 4).
# One file, one manager set, so all three focals are stream-comparable.
#
# Same stack, same artifacts, same 2x8 / 24-round / 100-episode protocol and
# the same `reseed_per_run` seed discipline as the parent's paired arm.
seed: 44
reseed_per_run: true
artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep_vnode_stimulus_skip_herding_copula/model/architecture_node+edge+rnn__dataset_50ep__epochs_575.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_joint_exodus/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt
managers:
  never:
    type: rule_based
    rule: never
  ah_punisher:
    type: linear
    path: artifacts/baselines/punishment_multinomial_timeout_severity_copula.joblib
  thr9_p10:
    type: rule_based
    rule: threshold
    threshold: 9
    amount: 10
  inv_thr11_p10:
    type: rule_based
    rule: inv_threshold
    threshold: 11
    amount: 10
  inv_thr7_p10:
    type: rule_based
    rule: inv_threshold
    threshold: 7
    amount: 10
pairings:
- name: ah_punisher_vs_ah_punisher
  group_0: ah_punisher
  group_1: ah_punisher
- name: never_vs_never
  group_0: never
  group_1: never
- name: inv_thr11_p10_vs_ah_punisher
  group_0: inv_thr11_p10
  group_1: ah_punisher
- name: inv_thr7_p10_vs_ah_punisher
  group_0: inv_thr7_p10
  group_1: ah_punisher
- name: thr9_p10_vs_ah_punisher
  group_0: thr9_p10
  group_1: ah_punisher
- name: never_vs_ah_punisher
  group_0: never
  group_1: ah_punisher
- name: inv_thr11_p10_vs_never
  group_0: inv_thr11_p10
  group_1: never
- name: inv_thr7_p10_vs_never
  group_0: inv_thr7_p10
  group_1: never
- name: thr9_p10_vs_never
  group_0: thr9_p10
  group_1: never
- name: ah_punisher_vs_never
  group_0: ah_punisher
  group_1: never
switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups:
- 0
- 0
- 0
- 0
- 1
- 1
- 1
- 1
n_contributions: 21
n_punishments: 31
n_rounds: 24
output_dir: plots/simulation/26_rule_inverted_targeting_s44
figure_name: rule_inverted_targeting_s44
save_per_round: true
basedir: .
