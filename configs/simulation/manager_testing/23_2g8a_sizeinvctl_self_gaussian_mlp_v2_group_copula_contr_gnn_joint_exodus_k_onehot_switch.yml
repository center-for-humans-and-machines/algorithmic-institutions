# contribution-size-onehot control: the parent's own stack
# (23_2g8a_kexo_self_gaussian_mlp_v2_group_copula_contr_gnn_joint_exodus_k_onehot_switch)
# re-simulated on this branch's code, unchanged. Proves step 1's
# `inv_group_size` pool feature is inert for a bundle that does not name
# it -- the parquet must reproduce the parent's bit for bit -- and is what
# licenses judging the candidate against the parent's committed scores.csv.
# Only output_dir/figure_name are retargeted; everything else, including
# contribution_model, is byte-identical to the parent config.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/baselines/contribution_gaussian_mlp_v2_group_copula.joblib
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_exodus_k_onehot/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_severity_copula.joblib

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_sizeinvctl_self_gaussian_mlp_v2_group_copula_contr_gnn_joint_exodus_k_onehot_switch
figure_name: 2g8a_sizeinvctl_self_gaussian_mlp_v2_group_copula_contr_gnn_joint_exodus_k_onehot_switch
save_per_round: true
basedir: .
