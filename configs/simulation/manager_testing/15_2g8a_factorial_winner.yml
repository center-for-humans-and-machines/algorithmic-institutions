# #103: simulate the best of the four §2 factorial cells (cell B,
# 03_2g8a_sum_b_lr5e4 -- lr 5e-4 / target_update_freq 200, marginal winner on
# group_payoff_sum) against (i) the autoregressive punishment AH it was trained
# against and (ii) a dummy zero-punishment manager. Same AH stack as training:
# group_switching_contribution_50ep + raven_script_22 valid + switch_pred_opt_50ep.

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep/model/architecture_node+edge+rnn__dataset_50ep__epochs_1000.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_pred_opt_50ep/model/architecture_mlp+rnn+edge__dataset_50ep__epochs_375.pt

managers:
  trained_b:
    type: rl
    path: artifacts/manager/03_2g8a_sum_b_lr5e4/model/03_2g8a_sum_b_lr5e4_manager.pt
  ah_opponent:
    type: human
    path: artifacts/artificial_humans/punishment_autoregressive_50ep/model/architecture_node+edge+autoregressive__dataset_50ep__epochs_7500.pt
  zero_punishment:
    type: dummy

pairings:
  - name: b_vs_ah
    group_0: trained_b
    group_1: ah_opponent
  - name: b_vs_zero
    group_0: trained_b
    group_1: zero_punishment

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/15_2g8a_factorial_winner
figure_name: 2g8a_factorial_winner
basedir: .
