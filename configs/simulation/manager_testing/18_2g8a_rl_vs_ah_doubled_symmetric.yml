# #103: pit the cell-C RL manager (trained against the OLD AH stack)
# against the new doubled AH stack — symmetric (mirror) pairings so the
# group_0 vs group_1 position doesn't confound. Includes rl self-play as
# a sanity check that the RL manager itself is group-symmetric.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep/model/architecture_node+edge+rnn__dataset_50ep__epochs_1000.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_pred_opt_50ep_doubled/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  rl_manager:
    type: rl
    path: artifacts/manager/03_2g8a_sum_c_lr1e3/model/03_2g8a_sum_c_lr1e3_manager.pt
  ah_doubled:
    type: human
    path: artifacts/artificial_humans/punishment_rnn_edge_50ep_doubled/model/architecture_node+edge+rnn__dataset_50ep_doubled.pt
  zero_punishment:
    type: dummy

pairings:
  - name: rl_vs_ah_doubled
    group_0: rl_manager
    group_1: ah_doubled
  - name: ah_doubled_vs_rl
    group_0: ah_doubled
    group_1: rl_manager
  - name: rl_vs_zero
    group_0: rl_manager
    group_1: zero_punishment
  - name: zero_vs_rl
    group_0: zero_punishment
    group_1: rl_manager
  - name: rl_vs_rl
    group_0: rl_manager
    group_1: rl_manager

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/18_2g8a_rl_vs_ah_doubled_symmetric
figure_name: 2g8a_rl_vs_ah_doubled_symmetric
save_per_round: true
basedir: .
