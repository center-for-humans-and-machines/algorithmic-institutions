# auto/punisher-severity-copula-v2: the reference stack
# (23_2g8a_self_gnn_contr_gnn_switch) with the punisher slot swapped to the
# severity-copula multinomial bundle (copula_rho estimated by pairwise MLE on
# the punisher's own train split). Single pairing; protocol byte-identical to
# the 23 family. Slug sits before `_self_` so evaluation_sweep.py's
# DIR_PATTERN still parses contr/switch.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep_herding_copula_v2/model/architecture_node+edge+rnn__dataset_50ep__epochs_575.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_pred_herding_copula_recal_4/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_severity_copula.joblib

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_swrecal4_self_gnncopar1_contr_herdcoprc4_switch
figure_name: 2g8a_swrecal4_self_gnncopar1_contr_herdcoprc4_switch
save_per_round: true
basedir: .
