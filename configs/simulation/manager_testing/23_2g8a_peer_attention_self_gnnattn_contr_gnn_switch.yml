# auto/contribution-peer-attention Stage 1: the reference severity-copula
# stack (23_2g8a_severity_copula_self_gnn_contr_gnn_switch) with the
# contribution slot swapped to the peer-attention GNN, no-edge-feature
# variant. Single pairing; protocol byte-identical to the 23 family. Slug
# sits before `_self_` so evaluation_sweep.py's DIR_PATTERN still parses.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/contribution_peer_attention_nosg/model/architecture_node+edge+rnn__dataset_50ep__epochs_575__attention_nosg.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_pred_opt_50ep_doubled_reanchored/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_severity_copula.joblib

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_peer_attention_self_gnnattn_contr_gnn_switch
figure_name: 2g8a_peer_attention_self_gnnattn_contr_gnn_switch
save_per_round: true
basedir: .
