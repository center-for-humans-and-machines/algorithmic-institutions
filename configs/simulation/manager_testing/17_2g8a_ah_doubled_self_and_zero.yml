# #103: simulate the retrained (doubled-data) punishment AH against itself
# and against a dummy zero-punishment manager. AH stack uses the doubled
# switch predictor too; contribution AH unchanged (no agent_group feature,
# not affected by the bias).

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep/model/architecture_node+edge+rnn__dataset_50ep__epochs_1000.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_pred_opt_50ep_doubled_reanchored/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  ah_doubled:
    type: human
    path: artifacts/artificial_humans/punishment_rnn_edge_50ep_doubled/model/architecture_node+edge+rnn__dataset_50ep_doubled.pt
  zero_punishment:
    type: dummy

pairings:
  - name: ah_doubled_vs_ah_doubled
    group_0: ah_doubled
    group_1: ah_doubled
  - name: ah_doubled_vs_zero
    group_0: ah_doubled
    group_1: zero_punishment

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/17_2g8a_ah_doubled_self_and_zero
figure_name: 2g8a_ah_doubled_self_and_zero
save_per_round: true
basedir: .
