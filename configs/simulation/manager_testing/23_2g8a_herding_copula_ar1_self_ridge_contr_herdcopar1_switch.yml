# auto/switch-herding-copula Stage 1, arm B Stage 2 (ridge contribution context)
# with the switch slot swapped to the herding-copula artifact (copula_rho + copula_phi, switch_every 4;
# estimated by pairwise MLE on the human train split; marginals identical to
# the base gnn switch). The punisher slot carries the severity-copula
# multinomial -- the reference punisher since 2026-08-12 (log note 8) --
# with the copula pairing FIRST, RNG-position-identical to the
# severity-copula baseline run; ridge/gaussian/gnn keep positions 2-4 of the
# original reference config. Protocol byte-identical to the 23 family. Slug
# sits before `_self_` so evaluation_sweep.py's DIR_PATTERN still parses.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/baselines/contribution_ridge_best.joblib
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_pred_herding_copula_ar1/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_severity_copula.joblib
  lin_ridge:
    type: linear
    path: artifacts/baselines/punishment_ridge_best.joblib
  lin_gaussian:
    type: linear
    path: artifacts/baselines/punishment_gaussian_best_with_contr.joblib
  gnn:
    type: human
    path: artifacts/artificial_humans/punishment_rnn_edge_50ep_doubled/model/architecture_node+edge+rnn__dataset_50ep_doubled.pt

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula
  - name: lin_ridge_self
    group_0: lin_ridge
    group_1: lin_ridge
  - name: lin_gaussian_self
    group_0: lin_gaussian
    group_1: lin_gaussian
  - name: gnn_self
    group_0: gnn
    group_1: gnn

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_herding_copula_ar1_self_ridge_contr_herdcopar1_switch
figure_name: 2g8a_herding_copula_ar1_self_ridge_contr_herdcopar1_switch
save_per_round: true
basedir: .
