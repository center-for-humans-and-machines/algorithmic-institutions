# copula-closed-loop-variance, arm C (no persistence): the b_skip _curpun stack
# (PR #181 stimulus-skip contributor, joint-exodus GNN switch,
# current-contribution multinomial copula punisher) with the stamped copula at the fitted rho 0.0395
# but phi = 0 (a fresh shared latent every round; stamp_copula_phi0.py).
# Protocol byte-identical to the source config
# 23_2g8a_contr_stimulus_skip_self_gnncopar1_contr_gnn_switch_curpun.yml
# (seed 42, 100 episodes, 24 rounds, single pairing); only the contribution
# artifact, output_dir and figure_name differ.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep_vnode_stimulus_skip_herding_copula_phi0/model/architecture_node+edge+rnn__dataset_50ep__epochs_575.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_joint_exodus/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_current_contr_severity_copula.joblib

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_copula_cl_variance_c_phi0
figure_name: 2g8a_copula_cl_variance_c_phi0
save_per_round: true
basedir: .
