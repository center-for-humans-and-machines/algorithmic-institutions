# contribution-inflated-gmlp, CONTROL: PR #174's stack re-simulated verbatim
# on this branch's code -- the parent's own stamped gaussian_mlp_v2 group-copula
# contributor (copula_rho_p 0.04378520865574197), the one-hot-k joint-exodus GNN
# switch and the PR #160 severity-copula punisher. It must reproduce the parent's
# per_round.parquet bit for bit (3cb8b3d7...fef3f): that is the proof step 5's
# adapter branch is inert for a Gaussian bundle, and it is what licenses judging
# the candidate against the parent's committed scores.csv. Only output_dir and
# figure_name differ from the parent's config. Slug sits before `_self_` so
# evaluation_sweep.py's DIR_PATTERN still parses contr/switch.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/baselines/contribution_gaussian_mlp_v2_group_copula.joblib
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_exodus_k_onehot/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_severity_copula.joblib

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_inflctl_self_gaussian_mlp_v2_group_copula_contr_gnn_joint_exodus_k_onehot_switch
figure_name: 2g8a_inflctl_self_gaussian_mlp_v2_group_copula_contr_gnn_joint_exodus_k_onehot_switch
save_per_round: true
basedir: .
