# Autoresearch contribution-cg-selfdrop, Stage-2 lin-switch cell: the
# 23-family template with the contribution model swapped to the winning
# p=0.15 selfdrop candidate (M4 features + prev_contribution input
# dropout, PR #144's auto_contribution_selfdrop_15 artifact). The dir
# name keeps the `_self_gnn_contr_lin_switch` suffix so
# evaluation_sweep.py parses it -- here `gnn` means the candidate.
# Everything else identical to 23_2g8a_self_gnn_contr_lin_switch.yml.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/auto_contribution_selfdrop_15/model/architecture_node+edge+rnn__dataset_50ep__epochs_575__own_group_True__same_group_True__self_dropout_0.15.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/baselines/does_switch_multinomial_best.joblib

managers:
  lin_multinomial:
    type: linear
    path: artifacts/baselines/punishment_multinomial_best_with_contr.joblib
  lin_ridge:
    type: linear
    path: artifacts/baselines/punishment_ridge_best.joblib
  lin_gaussian:
    type: linear
    path: artifacts/baselines/punishment_gaussian_best_with_contr.joblib
  gnn:
    type: human
    path: artifacts/artificial_humans/punishment_rnn_edge_50ep_doubled/model/architecture_node+edge+rnn__dataset_50ep_doubled.pt

pairings:
  - name: lin_multinomial_self
    group_0: lin_multinomial
    group_1: lin_multinomial
  - name: lin_ridge_self
    group_0: lin_ridge
    group_1: lin_ridge
  - name: lin_gaussian_self
    group_0: lin_gaussian
    group_1: lin_gaussian
  - name: gnn_self
    group_0: gnn
    group_1: gnn

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/auto_cgselfdrop15_2g8a_self_gnn_contr_lin_switch
figure_name: cgselfdrop15_2g8a_self_gnn_contr_lin_switch
save_per_round: true
basedir: .
