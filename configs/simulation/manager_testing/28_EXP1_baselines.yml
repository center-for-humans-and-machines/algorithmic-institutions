# Experiment 1's setup (docs/plans/policy-finder-exp1.md, step 2): one group of
# 4 contribution clones (21/22 v4, the ones experiment 1's RL manager was
# trained against), 24 rounds, no switching. Each manager plays the clones
# alone. Reproduces experiment 1's recorded payoffs as a check of the
# restored models: deployed RL manager 658.6, near-zero punishment ~590,
# human-like manager clone 550.5 (payoff per player summed over the episode;
# temp/s3_stage/experiment_1/evaluation_sims/key_eval_measures.py).
#
# A timed-out player is out of the round's pool and cannot be punished (the
# env zeroes both). timeout_contribution "default" writes the clones' default
# (15) into the contribution field, the input the clones and the RL manager
# were trained with.
#
# The RL and human-like managers punish unbatched: episode_batch_size 1.

seed: 3000

artificial_humans:
  exp1:
    contribution_model: artifacts/behavioral_cloning/21_contribution_model_v4/model/architecture_node+edge+rnn__dataset_full.pt
    valid_model: artifacts/behavioral_cloning/22_contribution_valid_model_v4/model/rnn_False__dataset_full.pt

managers:
  rl_deployed:
    type: rl
    path: artifacts/manager/17_exp2_group_payoff_heavy_optimize/model/_manager.pt
  zero:
    type: dummy
    constant_punishment: 0
  humanlike:
    type: human
    path: artifacts/behavioral_cloning/23_punishment_autoregressive_v4/model/architecture_node+edge.pt
    autoregressive: true

n_episode_steps: 24
n_episodes: 1000
n_groups: 1
n_agents: 4
n_contributions: 21
n_punishments: 31
n_rounds: 24
timeout_contribution: default
episode_batch_size: 1

output_dir: plots/simulation/28_EXP1_baselines
figure_name: EXP1_baselines
save_per_round: true
basedir: .
