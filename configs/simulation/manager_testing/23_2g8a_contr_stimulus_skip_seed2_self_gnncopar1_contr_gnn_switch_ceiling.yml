# Seed-spread noise floor, arm 2 of 5 (branch auto/seed-spread-noise-floor).
# The frontier stack of PR #192
# (23_2g8a_contr_stimulus_skip_self_gnncopar1_contr_gnn_switch_ceiling) with
# ONLY the contribution artifact swapped, to PR #188's seed-ensemble member
# 2: the same config byte-for-byte as the shipped stimulus-skip contributor,
# trained with seed 2 instead of 38381, carrying the same frozen copula
# (rho 0.0394986, phi 1.0, switch_every 1, carried not recalibrated).
# Switch model, punisher, protocol, seed and episode count are byte-identical
# to the source config, so what varies across the six arms is the trained
# contributor and nothing else.
# The `_ceiling` suffix breaks evaluation_sweep.py's DIR_PATTERN on purpose.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep_vnode_stimulus_skip_seed_ensemble_copula/model/architecture_node+edge+rnn__dataset_50ep__epochs_575__seed_2.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_joint_exodus/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_ceiling_severity_copula.joblib

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_contr_stimulus_skip_seed2_self_gnncopar1_contr_gnn_switch_ceiling
figure_name: 2g8a_contr_stimulus_skip_seed2_self_gnncopar1_contr_gnn_switch_ceiling
save_per_round: true
basedir: .
