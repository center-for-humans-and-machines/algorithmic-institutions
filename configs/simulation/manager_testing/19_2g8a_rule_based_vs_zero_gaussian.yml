# #103 sanity-check with a LINEAR contribution baseline (heteroscedastic gaussian).
# Contribution: gaussian mu(x)/sigma(x) heads (sampled N(mu(x), sigma(x)));
# valid + switch revert to the GNN artificial humans (#119/#121).

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/baselines/contribution_gaussian_best.joblib
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_pred_opt_50ep_doubled/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  rule_k1:
    type: rule_based
    k: 1
  rule_k4:
    type: rule_based
    k: 4
  rule_k8:
    type: rule_based
    k: 8
  zero_punishment:
    type: dummy

pairings:
  - name: rule_k1_vs_zero
    group_0: rule_k1
    group_1: zero_punishment
  - name: zero_vs_rule_k1
    group_0: zero_punishment
    group_1: rule_k1
  - name: rule_k4_vs_zero
    group_0: rule_k4
    group_1: zero_punishment
  - name: zero_vs_rule_k4
    group_0: zero_punishment
    group_1: rule_k4
  - name: rule_k8_vs_zero
    group_0: rule_k8
    group_1: zero_punishment
  - name: zero_vs_rule_k8
    group_0: zero_punishment
    group_1: rule_k8
  - name: zero_vs_zero
    group_0: zero_punishment
    group_1: zero_punishment

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/19_2g8a_rule_based_vs_zero_gaussian
figure_name: 2g8a_rule_based_vs_zero_gaussian
save_per_round: true
basedir: .
