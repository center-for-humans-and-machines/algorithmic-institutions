# contribution-size-onehot candidate: the parent's stack
# (23_2g8a_kexo_self_gaussian_mlp_v2_group_copula_contr_gnn_joint_exodus_k_onehot_switch)
# with only the contribution_model swapped for the `inv_group_size`
# candidate -- the gaussian_mlp_v2 trunk retrained with the incumbent's
# seven features plus `inv_group_size` (1 / own current group size),
# re-stamped with the parent's group copula (rho_p = the re-estimated
# rho_total, rho_t = 0.0). Everything else, including the switch model,
# punisher, valid model and protocol, is byte-identical to the parent
# config; only contribution_model/output_dir/figure_name are retargeted.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/baselines/contribution_gaussian_mlp_v2_inv_size_group_copula.joblib
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_exodus_k_onehot/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_severity_copula.joblib

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_sizeinv_self_gaussian_mlp_v2_inv_size_group_copula_contr_gnn_joint_exodus_k_onehot_switch
figure_name: 2g8a_sizeinv_self_gaussian_mlp_v2_inv_size_group_copula_contr_gnn_joint_exodus_k_onehot_switch
save_per_round: true
basedir: .
