# Experiment 1, head to head (docs/plans/archive/policy-finder-exp1.md, step 9): the
# policy-finder campaign's three lineage bests (exp1-2026-11, setting exp1) at
# their GP peaks against experiment 1's deployed RL manager, zero punishment
# and the human-like manager clone. Each manager plays the 21/22 v4 clones
# alone, one group of 4 over 24 rounds, 2000 games, on seed 6000, which no
# sweep, final run or baseline sim used. Scored by the average payoff
# (pool_scores.group_payoff_scores) and by experiment 1's own formula.
#
#   pf_7: pf-20261105-7-v3, GP peak, final 656.05 +- 1.25
#   pf_3: pf-20261105-3-v4, GP peak, final 655.91 +- 1.23
#   pf_8: pf-20261105-8-v7, GP peak, final 654.47 +- 1.28
#   rl_deployed: 17_exp2_group_payoff_heavy_optimize (experiment 1's DQN)
#
# The RL and human-like managers punish unbatched: episode_batch_size 1.
# Report: docs/reports/policy_finder_exp1_vs_rl.md

seed: 6000
artificial_humans:
  exp1:
    contribution_model: artifacts/behavioral_cloning/21_contribution_model_v4/model/architecture_node+edge+rnn__dataset_full.pt
    valid_model: artifacts/behavioral_cloning/22_contribution_valid_model_v4/model/rnn_False__dataset_full.pt
managers:
  pf_7:
    type: rule_based
    rule: configs/managers/rule_based/pf-20261105-7-v3.yml
    params:
      free_rider_fine: 29.71338404198894
      curvature: 2.1769873977170433
      window: 7
      net_floor: 2
      net_end: 16
      net_scale: 0.8484157973484898
    setting: exp1
  pf_3:
    type: rule_based
    rule: configs/managers/rule_based/pf-20261105-3-v4.yml
    params:
      thr: 24
      pmax: 30.07813169262534
      gamma: 2.9260147554989424
      horizon: 7
      lthr: 4
      lstop: 15
    setting: exp1
  pf_8:
    type: rule_based
    rule: configs/managers/rule_based/pf-20261105-8-v7.yml
    params:
      free: 34.0
      mid: 6.919797558816308
      horizon: 7
      high: 20.0
      end: 18
    setting: exp1
  rl_deployed:
    type: rl
    path: artifacts/manager/17_exp2_group_payoff_heavy_optimize/model/_manager.pt
  zero:
    type: dummy
    constant_punishment: 0
  humanlike:
    type: human
    path: artifacts/behavioral_cloning/23_punishment_autoregressive_v4/model/architecture_node+edge.pt
    autoregressive: true
n_episode_steps: 24
n_episodes: 2000
n_groups: 1
n_agents: 4
n_contributions: 21
n_punishments: 31
n_rounds: 24
timeout_contribution: default
episode_batch_size: 1
output_dir: plots/simulation/30_EXP1_pf_vs_rl
figure_name: EXP1_pf_vs_rl
save_per_round: true
basedir: .
