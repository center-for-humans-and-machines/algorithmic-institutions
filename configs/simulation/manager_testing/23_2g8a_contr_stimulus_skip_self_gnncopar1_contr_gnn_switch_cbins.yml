# punisher-contribution-encoding, the GATED stack: PR #181's stack
# (23_2g8a_contr_stimulus_skip_self_gnncopar1_contr_gnn_switch -- vnode GNN
# contributor with the immediate-stimulus skip and its recalibrated copula,
# joint-exodus GNN switch) with the punisher slot swapped to the
# lin_multinomial whose current contribution enters as a 21-level one-hot
# (severity-copula-stamped copy, rho 0.4273 carried over). Only the punisher
# path, output_dir and figure_name differ from the parent's `_ceiling`
# config; protocol byte-identical (seed 42, 100 episodes, 24 rounds).
# Source: auto/punisher-ceiling-fix. The `_cbins` suffix breaks
# evaluation_sweep.py's DIR_PATTERN on purpose -- these dirs are read by the
# branch's own before/after table, not by the sweep.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep_vnode_stimulus_skip_herding_copula/model/architecture_node+edge+rnn__dataset_50ep__epochs_575.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_joint_exodus/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  lin_multinomial_copula:
    type: linear
    path: artifacts/baselines/punishment_multinomial_contr_bins_severity_copula.joblib

pairings:
  - name: lin_multinomial_copula_self
    group_0: lin_multinomial_copula
    group_1: lin_multinomial_copula

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/23_2g8a_contr_stimulus_skip_self_gnncopar1_contr_gnn_switch_cbins
figure_name: 2g8a_contr_stimulus_skip_self_gnncopar1_contr_gnn_switch_cbins
save_per_round: true
basedir: .
