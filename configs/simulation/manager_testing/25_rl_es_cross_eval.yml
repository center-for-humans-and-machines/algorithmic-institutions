# Cross-evaluation for the five evolution-strategies managers.
#
# The world is the training world slot for slot -- the same contribution,
# validity and switch artifacts the managers trained against, and the same
# opponent in group 1 -- so a difference between two rows is a difference
# between managers, not between worlds.
#
# WHY THE REFERENCE ROWS ARE WHAT THEY ARE, AND NOT `never` / `thr9_p10` /
# `prop10`. A first version of this config copied those three rule rows from
# 24_rl_new_clones_cross_eval.yml. They produced nonsense -- `never` punished a
# mean of 2.57 with a maximum of 20, and all three rows came out nearly
# identical -- and the reason is a silent one worth recording. This branch
# starts at 0ff44a9, and at that commit `api_manager.RuleBasedManager` is a
# SINGLE FIXED FORMULA, `clamp((20 - contribution - round_number) / k, 0, 30)`,
# whose constructor is `(self, k=1, n_punishments=31, **_)`. The named rules
# (`never`, `threshold`, `proportional`) were added later, on
# auto/rl-manager-two-worlds. `rule: never` is therefore swallowed by `**_` and
# every "rule" row silently runs the same k=1 manager. It does not raise.
#
# The references below are built only from what this tree actually has, and
# they are better suited to this arm's question anyway:
#
#   never  -- DummyManager(0). The floor, and the exact analogue of the three
#             ES seeds that ended punishing nothing.
#   flat1  -- DummyManager(1). The exact analogue of es_s46's learned policy.
#   flat2  -- DummyManager(2). The exact analogue of es_s44's learned policy.
#             These two are the control that decides whether a seed that ended
#             on a flat tax is doing anything beyond that flat tax: if es_s44
#             and flat2 agree on the leaver differential, it is not.
#   shortfall_k1 / shortfall_k4 -- RuleBasedManager at k=1 and k=4, named for
#             what the formula computes rather than borrowed from another
#             branch. Both are genuinely contribution-targeted (punishment
#             decreases in contribution), which is the direction the human
#             managers punish in, so they are the targeted end of the ladder.
#   lin_punisher -- this project's clone of a human manager, in group 1 for
#             every learned row and in the group-0 seat through its own
#             pairing.
#
# Re-running the references inside THIS file rather than quoting them is not
# redundancy: MultiManager's RNG draw depends on the config's manager set, so
# two managers are only stream-comparable within one config.
#
# See notes/autoresearch_log/rl-manager-evolution-strategies.md.

seed: 42

artificial_humans:
  group_switching:
    contribution_model: artifacts/artificial_humans/group_switching_contribution_50ep_vnode_stimulus_skip_herding_copula/model/architecture_node+edge+rnn__dataset_50ep__epochs_575.pt
    valid_model: artifacts/artificial_humans/raven_script_22/model/rnn_False__dataset_full.pt
    switch_model: artifacts/artificial_humans/switch_joint_exodus/model/architecture_mlp+rnn+edge__dataset_50ep_doubled.pt

managers:
  es_s42:
    type: rl
    path: artifacts/manager/rl_es_s42/model/rl_es_s42_manager.pt
  es_s43:
    type: rl
    path: artifacts/manager/rl_es_s43/model/rl_es_s43_manager.pt
  es_s44:
    type: rl
    path: artifacts/manager/rl_es_s44/model/rl_es_s44_manager.pt
  es_s45:
    type: rl
    path: artifacts/manager/rl_es_s45/model/rl_es_s45_manager.pt
  es_s46:
    type: rl
    path: artifacts/manager/rl_es_s46/model/rl_es_s46_manager.pt
  lin_punisher:
    type: linear
    path: artifacts/baselines/punishment_multinomial_ceiling_severity_copula.joblib
  never:
    type: dummy
    constant_punishment: 0
  flat1:
    type: dummy
    constant_punishment: 1
  flat2:
    type: dummy
    constant_punishment: 2
  shortfall_k1:
    type: rule_based
    k: 1
  shortfall_k4:
    type: rule_based
    k: 4

pairings:
  - name: es_s42_vs_punisher
    group_0: es_s42
    group_1: lin_punisher
  - name: es_s43_vs_punisher
    group_0: es_s43
    group_1: lin_punisher
  - name: es_s44_vs_punisher
    group_0: es_s44
    group_1: lin_punisher
  - name: es_s45_vs_punisher
    group_0: es_s45
    group_1: lin_punisher
  - name: es_s46_vs_punisher
    group_0: es_s46
    group_1: lin_punisher
  - name: lin_punisher_self
    group_0: lin_punisher
    group_1: lin_punisher
  - name: never_vs_punisher
    group_0: never
    group_1: lin_punisher
  - name: flat1_vs_punisher
    group_0: flat1
    group_1: lin_punisher
  - name: flat2_vs_punisher
    group_0: flat2
    group_1: lin_punisher
  - name: shortfall_k1_vs_punisher
    group_0: shortfall_k1
    group_1: lin_punisher
  - name: shortfall_k4_vs_punisher
    group_0: shortfall_k4
    group_1: lin_punisher

switch_every: 4
n_episode_steps: 24
n_episodes: 100
n_groups: 2
n_agents: 8
agent_groups: [0, 0, 0, 0, 1, 1, 1, 1]
n_contributions: 21
n_punishments: 31
n_rounds: 24

output_dir: plots/simulation/25_rl_es_cross_eval
figure_name: rl_es_cross_eval
save_per_round: true
basedir: .
