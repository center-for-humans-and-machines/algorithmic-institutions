# Group-target factor manifest. Per chosen episode, `selector` picks
# one game-group at t* (the agent_group partition; in 2g8a runs, 4 of
# 8 agents) and the override is applied to all of its members.
#
#   - lowest-contributing group, factor=2.0 (punish hard)  × early/late
#   - highest-contributing group, factor=0.5 (forgive)     × early/late
#
# switch_every=4 → switch decisions at end of rounds 3, 7, 11, 15, 19.
# Per phase we probe both post-switch (first round of a new block) and
# pre-switch (last round before the next decision):
#   early-post=4, early-pre=6, late-post=16, late-pre=18.
# Pre-switch scenarios get a P(switch) panel (t*+1 is a decision round).

base_config: configs/simulation/counterfactual/punish_individual_late.yml
chosen_episodes: [3, 7, 12, 19]
n_seeds: 50
output_dir: artifacts/counterfactual/group

grids:
  - intervention_round: [4, 6, 16, 18]
    feature: [punishment]
    target: [group]
    selector: [lowest_contributor]
    factor: [2.0]

  - intervention_round: [4, 6, 16, 18]
    feature: [punishment]
    target: [group]
    selector: [highest_contributor]
    factor: [0.5]
