# Group-target intervention manifest. Two team selectors × two timings:
#   - lowest-contributing teams, factor=2.0 (punish hard)  × early/late
#   - highest-contributing teams, factor=0.5 (forgive)     × early/late
#
# `group_selector` picks K episodes by full-game team-mean contribution.
# Each scenario applies the factor to *all 8 agents* at t*; metrics are
# averaged over (agents within team, K teams, n_seeds).

base_config: configs/simulation/counterfactual/punish_individual_late.yml
n_seeds: 50
output_dir: artifacts/counterfactual/group

# switch_every=4 → switch decisions at end of rounds 3, 7, 11, 15, 19.
# Per phase we probe both post-switch (first round of a new block) and
# pre-switch (last round before the next decision):
#   early-post=4, early-pre=6, late-post=16, late-pre=18.
# Pre-switch scenarios get a P(switch) panel (t*+1 is a decision round).
grids:
  - intervention_round: [4, 6, 16, 18]
    feature: [punishment]
    target: [group]
    group_selector: [lowest_contributor]
    n_groups: [5]
    factor: [2.0]

  - intervention_round: [4, 6, 16, 18]
    feature: [punishment]
    target: [group]
    group_selector: [highest_contributor]
    n_groups: [5]
    factor: [0.5]
