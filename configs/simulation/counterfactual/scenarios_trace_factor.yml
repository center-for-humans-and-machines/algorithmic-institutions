# Tiny factor-mode manifest for tracing the probe mechanism end-to-end
# with --trace. One small grid: two timings × two features × one selector
# × two factors (one < 1, one > 1) → 8 scenarios. Two episodes, two seeds.
# Outputs go to artifacts/counterfactual/trace_factor/.

base_config: configs/simulation/counterfactual/punish_individual_late.yml
chosen_episodes: [3, 7]
n_seeds: 2
output_dir: artifacts/counterfactual/trace_factor

grids:
  - intervention_round: [6, 16]
    feature: [punishment, contribution]
    target: [individual]
    selector: [lowest_contributor]
    factor: [0.5, 2.0]
