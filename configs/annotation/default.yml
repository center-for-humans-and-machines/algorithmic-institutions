# Step classification of the policy-finder search.
# Spec: docs/plans/step-classification-pipeline.md
# CLI: python -m aimanager.annotation <command> --run <run_id> [--config this file]

corpus:
  repo: .
  # git ref globs, read with git ls-tree / git show (no checkout)
  refs:
    - origin/policy-finder/pf-20261104-*
    - origin/policy-finder/pf-20261105-*
    - origin/policy-finder/pf-20261106-*
  rule_dir: configs/managers/rule_based
  notes_dir: notes/policy_finder
  sweep_path: plots/simulation/policy_finder/{stem}_sweep/final/sweep.json
  # Versions without a sweep.json get status "missing" unless listed here.
  score_status_overrides:
    pf-20261104-1-v2: not_run
    pf-20261104-11-v2: not_run
    pf-20261104-7-v7: failed

sampling:
  seed: 20261112
  # free coding (step 1a): versions per lineage, alternating early and late
  free_coding_per_lineage: 1
  # expert check (step 6): held-out versions, stratified by campaign
  expert_check_n: 30

llm:
  # extraction, assignment and judge calls
  temperature: 0.0
  # proposals and consolidation: long list generation at 0 looped on DeepSeek
  # (prod1); its model card recommends a non-zero temperature. The seed is
  # sent with the request (and so is part of the cache key) and recorded in
  # the manifests; a degenerate reply is re-asked once with seed + 1.
  temperature_generate: 0.6
  seed_generate: 20261112
  # requests in flight, = --max-num-seqs (128): on viper the server never
  # queued at 64 (viper1/viper2), so the client was the bottleneck
  concurrency: 128
  # the server's context length; a cluster job overrides it with
  # ANNOT_MAX_MODEL_LEN (= --max-model-len). Proposal prompts are cut to fit
  # it together with max_tokens.propose.retry.
  max_model_len: 32768
  connect_timeout: 10
  # seconds without a byte from the server; sized for the longest structured
  # reply (12k tokens at a slow ~15 tokens/s under full batch load)
  read_timeout: 900
  # a read timeout is retried at most this many times
  timeout_retries: 1
  # backoff (seconds) between attempts after a 5xx, 429, connection error or a
  # malformed 200
  backoff: [5, 10, 20, 40]
  # abort the whole step after this many failed attempts in a row (any call):
  # a dead or hung server should end the job, not stall it
  max_consecutive_server_errors: 6
  # abort the whole step after this many HTTP 4xx replies
  max_client_errors: 3
  # Extra top-level request fields, by model. The first entry whose `match`
  # occurs in the model id (case-insensitive) wins; `default` applies otherwise.
  # The chosen body is logged once per step.
  extra_body:
    default:
      chat_template_kwargs: {enable_thinking: false}
    models:
      - match: DeepSeek
        body: {chat_template_kwargs: {thinking: false}}
      - match: GLM
        body: {chat_template_kwargs: {enable_thinking: false}}
  # max_tokens per pass kind; on finish_reason == length one retry with `retry`
  max_tokens:
    open_rules: {first: 2048, retry: 4096}
    open_notes: {first: 6144, retry: 12288}
    propose: {first: 6144, retry: 12288}
    assign: {first: 64, retry: 256}
    judge: {first: 6144, retry: 12288}
    consolidate: {first: 8192, retry: 16384}
    place: {first: 1024, retry: 4096}

# Share of calls of one pass kind that may fail in a step before the step
# raises without writing anything (0: every call must succeed). Failed items
# never count as evidence: a code is not dropped and a candidate not rejected
# because of them.
failure_budget:
  open_rules: 0.05
  open_notes: 0.05
  assign: 0.02
  propose: 0.0
  judge: 0.0
  consolidate: 0.0
  place: 0.0

clustering:
  # proposal call sees at most this many items, and only as many as fit the
  # context length (seeded sample beyond that; the step logs how many)
  max_items_in_proposal: 400
  refine_rounds: 2
  # a refinement round runs only if at least this many items are unassigned
  min_unassigned: 3
  # codes with fewer members after the last assignment are dropped
  min_members: 1
  # a proposal reply that repeats one name more often than this (or fills the
  # schema cap with repeats) is degenerate and re-asked once
  max_name_repeats: 3

saturation:
  batch_size: 6

# Target sizes of the codebooks. These are settings, not limits: the proposal
# and consolidation prompts ask for about this many codes in total, merging
# rather than adding when in doubt; a second consolidation pass runs if more
# than 1.5 times the target survive the first. target_candidates is the size
# the coverage step aims for with the candidate codes from the notes.
codebook:
  what: {target_codes: 30, target_candidates: 15}
  why: {target_codes: 25}
  basis: {target_codes: 10}

held_out:
  # The notes of the expert-check hold-out versions are extracted in the open
  # pass but left out of candidate building, clustering and consolidation, so
  # no codebook decision sees a held-out version (its rule never did); they are
  # coded in stage B like all others. prod2 predates this setting.
  exclude_notes_from_codebook: true

coverage:
  # a candidate code from the notes is added only if the judge finds it in at
  # least one rule and in at most this share of the rules judged; above it, it
  # goes to codebook/non_discriminating.yml. join flags every code above it.
  max_prevalence: 0.9

judge:
  # rule judge runs per rule, each with the codes in a different seeded order;
  # disagreements go to one tie-break run. Repeats 1 and 2 give the judge's
  # test-retest reliability (analysis/judge_reliability.csv), so keep >= 2.
  repeats: 2
  # A code is unreliable (listed in quality.json; join marks events involving
  # it) when Cohen's kappa of the two primary repeats is below min_kappa or its
  # positive agreement 2*both/(pos1+pos2) is below min_positive_agreement.
  # Raw agreement says little when most rules lack a code. A code with fewer
  # than min_positives positives in either repeat is `rare`, not rated.
  min_kappa: 0.8
  min_positive_agreement: 0.85
  min_positives: 5

join:
  # rule coder whose codes count as in_rule; "auto" = the LLM judge
  coder: auto

# Game setting per campaign, put into the per-document part of every prompt
# that shows a rule or notes, and copied into corpus/versions.jsonl (`setting`).
# Only facts stated in the agents' prompts (.claude/agents/*.md on the refs),
# docs/reports/basics*.md, scripts/policy_finder/campaigns/*.yml and
# configs/simulation/opponents/exp2_multi.yml on the campaign's branches.
settings:
  pf-20261104: |
    Campaign pf-20261104 (two groups with switching, one opponent).
    Eight players form two groups of four, each group with its own manager, and play 24 rounds (0-23). Each round every player receives 20 points and contributes 0-20 of them to their group's pool. After seeing the round's contributions, the manager deals each member of its own group a punishment of 0-30 points, deducted from that player's account and from the group's pool. The pool is 1.6 times the group's contributions minus its punishments, split equally among the members who contributed that round. After the 4th, 8th, 12th, 16th and 20th round (rounds 3, 7, 11, 15 and 19) every player may move to the other group, so a group can hold 0 to 8 players. A player who times out contributes 0, is not punished and gets no share of the pool that round.
    The rule manages one group in simulation against artificial humans (models trained on the human experiments); the other group is managed by `ah`, a model trained on the human managers' punishments. The score is the rule's group's common pool, averaged over rounds and episodes (an empty group counts 0), compared with `ah`'s group's. Reference simulations available to the agent: `ah` and `zero` (never punishes) against each other.
    The rule's code sees, per player of both groups and per round so far, the contributions `c`, `valid` (did not time out), the punishments `p` dealt by either manager, `in_group` (was in the rule's group) and the round `t`; it returns one `punishment` per player, clamped to 0-30, floored to integers and applied to the rule's own group only.
  pf-20261105: |
    Campaign pf-20261105 (one group, no switching, no opponent).
    One group of 4 players with one manager plays 24 rounds (0-23); nobody joins or leaves, and there is no other group. Each round every player gets 20 points and contributes 0-20 of them to the group's pool. After seeing the round's contributions, the manager deals each valid player a punishment of 0-30 points, deducted from that player's payoff and also from the pool. The pool is 1.6 times the sum of contributions minus the sum of punishments over the round's valid players, shared equally among them: a valid player's round payoff is 20 - c - p + (1.6 * sum(c) - sum(p)) / n. A player who times out contributes nothing, cannot be punished and takes no part in that round's pool.
    The score is the players' average payoff: per round the mean payoff of the valid players, summed over the 24 rounds, averaged over games. Rules are tested in simulation, one group managed by the rule alone, against artificial humans trained on human pilot sessions (groups of 4 over 8 or 16 rounds, under a human manager or under a rule manager with random parameters). Reference simulations available to the agent: `zero` (never punishes) and `humanlike` (a model of the pilots' human managers).
    The rule's code sees, per player and per round so far, the contributions `c`, `valid` (did not time out), the punishments `p` and the round `t`; it returns one `punishment` per player, clamped to 0-30 and floored to integers.
  pf-20261106: |
    Campaign pf-20261106 (two groups with switching, four unnamed opponents).
    Eight players form two groups of four, each group with its own manager, and play 24 rounds (0-23). Each round every player receives 20 points and contributes 0-20 of them to their group's pool. After seeing the round's contributions, the manager deals each member of its own group a punishment of 0-30 points, deducted from that player's account and from the group's pool. The pool is 1.6 times the group's contributions minus its punishments, split equally among the members who contributed that round. After the 4th, 8th, 12th, 16th and 20th round (rounds 3, 7, 11, 15 and 19) every player may move to the other group, so a group can hold 0 to 8 players. A player who times out contributes 0, is not punished and gets no share of the pool that round.
    The rule manages one group in simulation against artificial humans (models trained on the human experiments) while another manager runs the other group. Each rule plays four other managers, half the games from each group, and is scored by its group's common pool averaged over rounds and episodes (an empty group counts 0), then over the four. The agent was not told who they are and saw them only as `opponent_1` to `opponent_4`; the rule can tell them apart only by their punishments in `p`.
    The rule's code sees, per player of both groups and per round so far, the contributions `c`, `valid` (did not time out), the punishments `p` dealt by either manager, `in_group` (was in the rule's group) and the round `t`; it returns one `punishment` per player, clamped to 0-30, floored to integers and applied to the rule's own group only.
