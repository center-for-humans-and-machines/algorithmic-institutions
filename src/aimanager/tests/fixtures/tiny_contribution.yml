description: >-
  Tiny contribution fixture for sanity-snapshot tests. Mirrors the
  canonical 50ep contribution config but with n_cross_val=2, epochs=2,
  batch_size=5, device=cpu so the run completes in seconds on the
  Raven login node.
job_id: tiny_contribution
fraction_training: 1.0
seed: 38381
mask_name: contribution_valid
experiment_names: [ah_group_switching]
labels:
  architecture: node+edge+rnn
  dataset: tiny
n_player: 8
n_groups: 2
n_cross_val: 2
data_file: experiments/2group_8agent_50ep.csv
model_name: graph
shuffle_features: []
basedir: .
output_dir: src/aimanager/tests/fixtures/_artifacts/tiny_contribution
model_args:
  y_levels: 21
  y_name: contribution
  hidden_size: 20
  add_rnn: True
  add_edge_model: True
  add_global_model: False
  x_encoding:
    - name: prev_contribution
      n_levels: 21
      encoding: numeric
    - name: prev_punishment
      n_levels: 31
      encoding: numeric
optimizer_args:
  lr: 3.e-4
  weight_decay: 1.e-5
train_args:
  epochs: 2
  batch_size: 5
  clamp_grad: 1
  eval_period: 1
  l1_entropy: 0
device: cpu
autoregression: False
