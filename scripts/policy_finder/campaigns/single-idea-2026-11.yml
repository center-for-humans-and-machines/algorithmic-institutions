# The policy finder, one idea per version (.claude/agents/policy-finder-single-idea.md):
# experiment 2's game against ah. Every lineage starts from the seed rule
# p = alpha * (20 - c) (scripts/policy_finder/seeds/single_idea.yml), swept and
# scored without an agent. Each later version changes one idea of its lineage's
# best version so far and justifies it by a paper cited from memory (no network;
# references are checked afterwards), by one metric from the data, or by both.
# Five independent chains of fixed length: top_k equals n_fresh, so no chain is
# dropped, and each runs the seed plus 20 changes. A version that fails its
# check or lowers the result still takes its place in the chain.
# Run: PF_RUNS=... PF_BASE=<a branch with this mode> \
#      python scripts/policy_finder/campaign.py run <this file>
prefix: pf-20261126
setting: exp2
mode: single_idea
n_fresh: 5
generations: 20
top_k: 5
min_params: 1
max_params: 1
sobol_points: 256
parallel: 5
error_retries: 3
retry_wait: 600
summarize: null
