# The rerun of dais-qwen-exp1.yml on the fixed setup (served context 262144
# reaching OpenCode, early compaction, the agent's own /tmp allowed): only the
# prefix differs, to measure how much of the gap to Opus was the setup.
# The open-weight run of experiment 1 on DAIS, in the old (free) setting,
# exactly as the Opus reference campaign exp1-2026-11.yml (pf-20261105)
# ran it, but for the harness, the model and the prefix: OpenCode agents on
# Qwen3-Coder-Next served by vLLM in the same job (infra/dais/campaign.slurm.sh),
# sims in the job's CPU pool, episode sizes the pipeline's defaults for the
# setting (PF_SWEEP_EPISODES=default, PF_FINAL_EPISODES=default).
# Judged by infra/dais/reevaluate.py against the reference curve
# (docs/reports/policy_finder_reference_curves.md).
prefix: pfq2-exp1-20261128
setting: exp1
mode: free
n_fresh: 12
generations: 6
top_k: 4
min_params: 1
max_params: 5
sobol_points: 256
parallel: 12
error_retries: 3
retry_wait: 600
summarize: null
harness: opencode
model: Qwen/Qwen3-Coder-Next
base_url: "{env:PF_LLM_BASE_URL}"
