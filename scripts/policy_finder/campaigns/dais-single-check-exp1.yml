# Behavioural check of experiment 1's single-idea mode (gpudev, 15 minutes):
# one chain, the seed and one change, a 16-point sweep at smoke size
# (PF_SWEEP_EPISODES=20, PF_FINAL_EPISODES=20). Any served model (see
# dais-single-exp1.yml).
prefix: "pfsic-exp1-{env:PF_MODEL_TAG}"
setting: exp1
mode: single_idea
n_fresh: 1
generations: 1
top_k: 1
min_params: 0
max_params: 0
iterate_max_params: 4
sobol_points: 16
parallel: 1
error_retries: 1
retry_wait: 30
harness: opencode
model: "{env:PF_LLM_MODEL}"
base_url: "{env:PF_LLM_BASE_URL}"
