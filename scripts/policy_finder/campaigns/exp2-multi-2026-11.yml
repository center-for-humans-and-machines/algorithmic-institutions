# The policy finder against several governors (docs/plans/policy-finder-multi-opponent.md):
# experiment 2's game, each design point scored by the mean of its group's pool
# against the four governors of configs/simulation/opponents/exp2_multi.yml, which
# the agents never see by name. 125 games per opponent per sweep point, 2000 per
# final point (pipeline.SETTING_EPISODES). Same budget as proxy-2026-11.yml.
# The prefix is a day on: pf-20261105 is experiment 1's campaign.
# Run: PF_RUNS=... PF_WORKTREE_ROOT=$PF_RUNS/worktrees_multi PF_BASE=<branch> \
#      python scripts/policy_finder/campaign.py run <this file>
prefix: pf-20261106
setting: exp2_multi
n_fresh: 12
generations: 6
top_k: 4
min_params: 1
max_params: 5
sobol_points: 256
parallel: 12
error_retries: 3
retry_wait: 600
summarize: null
