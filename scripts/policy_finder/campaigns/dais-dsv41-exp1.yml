# The open-weight run of experiment 1 with DeepSeek-V4.1-Flash-1017 on DAIS
# (infra/dais/model_profiles/deepseek-v4.1-flash-1017.sh): the same campaign
# as dais-qwen-exp1.yml and the Opus reference but for the model and the
# prefix.
# Unlike the Opus reference (top_k 4), every lineage is iterated in every
# generation (top_k 12, Levin, 2026-11-28): 12 x 7 = 84 versions. The
# Opus-comparable result is that of the 4 lineages best after generation 1,
# which a top_k 4 campaign would have iterated throughout (campaign.py:
# lineage bests only rise, the others' stay fixed).
prefix: pfds-exp1-20261128
setting: exp1
mode: free
n_fresh: 12
generations: 6
top_k: 12
min_params: 1
max_params: 5
sobol_points: 256
parallel: 12
error_retries: 3
retry_wait: 600
summarize: null
harness: opencode
model: deepseek-ai/DeepSeek-V4.1-Flash-1017
base_url: "{env:PF_LLM_BASE_URL}"
