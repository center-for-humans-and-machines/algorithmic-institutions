<!-- Prototype: the gmlp stack (#177 tip) drawn as machinery.
     Visual-language draft for the summary report; the data-driven
     generator follows once the style is approved. -->
<title>Stack Machinery</title>
<style>
  body { background: #fcfcfb; color: #1a1a19; font-family: system-ui, sans-serif;
         margin: 2rem auto; max-width: 1220px; }
  figure { margin: 0; }
  svg { max-width: 100%; height: auto; }
  figcaption { color: #52514e; font-size: 0.9rem; margin-top: 0.6rem; }
</style>
<h2>The gaussian-MLP stack (#177 tip) as machinery</h2>
<figure>
<svg viewBox="0 0 1180 700" role="img" font-family="system-ui, sans-serif"
     aria-label="The gaussian-MLP stack drawn as a three-bay machine: contribution, switch, punisher. Tinted units were installed by campaign PRs; plain units are stock.">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- legend -->
  <g font-size="11" fill="currentColor">
    <rect x="30" y="18" width="14" height="14" rx="3" fill="#eb6834" fill-opacity="0.16" stroke="#eb6834"/>
    <text x="50" y="29">nonlinear trunk</text>
    <rect x="160" y="18" width="14" height="14" rx="3" fill="#4a3aa7" fill-opacity="0.14" stroke="#4a3aa7"/>
    <text x="180" y="29">structured head</text>
    <rect x="295" y="18" width="14" height="14" rx="3" fill="#2a78d6" fill-opacity="0.14" stroke="#2a78d6"/>
    <text x="315" y="29">correlated-sampling unit</text>
    <rect x="480" y="18" width="14" height="14" rx="3" fill="#1baf7a" fill-opacity="0.2" stroke="#1baf7a"/>
    <text x="500" y="29">feature retrofit plate</text>
    <rect x="640" y="18" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.6"/>
    <text x="660" y="29">stock part</text>
    <rect x="742" y="16" width="34" height="17" rx="8" fill="#1a1a19"/>
    <text x="759" y="28.5" fill="#fcfcfb" text-anchor="middle" font-size="10">#PR</text>
    <text x="784" y="29">installed by</text>
  </g>

  <!-- ============ CONTRIBUTION BAY ============ -->
  <rect x="30" y="60" width="360" height="470" rx="10" fill="none"
        stroke="currentColor" stroke-opacity="0.35"/>
  <text x="210" y="82" text-anchor="middle" font-size="13" font-weight="600"
        fill="currentColor">CONTRIBUTION BAY</text>

  <!-- intake -->
  <rect x="70" y="98" width="280" height="46" rx="6" fill="none"
        stroke="currentColor" stroke-opacity="0.6"/>
  <text x="210" y="117" text-anchor="middle" font-size="11.5" fill="currentColor">feature intake</text>
  <text x="210" y="132" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.75">self · own-group · window · structural</text>
  <rect x="238" y="138" width="126" height="18" rx="4" fill="#1baf7a" fill-opacity="0.2" stroke="#1baf7a"/>
  <text x="301" y="151" text-anchor="middle" font-size="9.5" fill="currentColor">group core forced  #167</text>

  <line x1="210" y1="156" x2="210" y2="182" stroke="currentColor" marker-end="url(#arr)"/>

  <!-- trunk -->
  <rect x="70" y="186" width="280" height="62" rx="6" fill="#eb6834"
        fill-opacity="0.16" stroke="#eb6834"/>
  <text x="210" y="211" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600">2-layer Gaussian MLP trunk</text>
  <text x="210" y="228" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.75">hidden 8 · heteroscedastic</text>
  <rect x="316" y="178" width="34" height="17" rx="8" fill="#1a1a19"/>
  <text x="333" y="190.5" fill="#fcfcfb" text-anchor="middle" font-size="10">#167</text>

  <line x1="210" y1="248" x2="210" y2="284" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="220" y="270" font-size="10" fill="currentColor" opacity="0.75">mu, sigma, atom logits</text>

  <!-- emission -->
  <rect x="70" y="288" width="280" height="62" rx="6" fill="#4a3aa7"
        fill-opacity="0.14" stroke="#4a3aa7"/>
  <text x="210" y="313" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600">inflated binned-Gaussian head</text>
  <text x="210" y="330" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.75">body + repeat / 0 / 20 atoms</text>
  <rect x="316" y="280" width="34" height="17" rx="8" fill="#1a1a19"/>
  <text x="333" y="292.5" fill="#fcfcfb" text-anchor="middle" font-size="10">#177</text>

  <line x1="210" y1="350" x2="210" y2="386" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="220" y="372" font-size="10" fill="currentColor" opacity="0.75">per-agent marginals</text>

  <!-- copula -->
  <rect x="70" y="390" width="280" height="62" rx="6" fill="#2a78d6"
        fill-opacity="0.14" stroke="#2a78d6"/>
  <text x="210" y="415" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600">group copula unit</text>
  <text x="210" y="432" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.75">u_g per episode + v_g per round, marginal-preserving</text>
  <rect x="316" y="382" width="34" height="17" rx="8" fill="#1a1a19"/>
  <text x="333" y="394.5" fill="#fcfcfb" text-anchor="middle" font-size="10">#170</text>

  <line x1="210" y1="452" x2="210" y2="545" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="220" y="500" font-size="10.5" fill="currentColor">contributions c_i (0..20)</text>

  <!-- ============ SWITCH BAY ============ -->
  <rect x="420" y="60" width="360" height="470" rx="10" fill="none"
        stroke="currentColor" stroke-opacity="0.35"/>
  <text x="600" y="82" text-anchor="middle" font-size="13" font-weight="600"
        fill="currentColor">SWITCH BAY</text>
  <text x="600" y="97" text-anchor="middle" font-size="10" fill="currentColor"
        opacity="0.7">fires every 4th round</text>

  <!-- trunk -->
  <rect x="460" y="108" width="280" height="56" rx="6" fill="none"
        stroke="currentColor" stroke-opacity="0.6"/>
  <text x="600" y="131" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600">GNN switch trunk</text>
  <text x="600" y="147" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.75">mlp + rnn + edge (stock)</text>

  <line x1="530" y1="164" x2="530" y2="204" stroke="currentColor"
        stroke-dasharray="4 4" stroke-opacity="0.5" marker-end="url(#arr)"/>
  <line x1="670" y1="164" x2="670" y2="204" stroke="currentColor" marker-end="url(#arr)"/>

  <!-- bypassed per-agent head -->
  <rect x="450" y="208" width="160" height="52" rx="6" fill="none"
        stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="5 4"/>
  <text x="530" y="230" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">per-agent Bernoulli</text>
  <text x="530" y="246" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.6">bypassed on decision rounds</text>

  <!-- joint head -->
  <rect x="630" y="208" width="130" height="72" rx="6" fill="#4a3aa7"
        fill-opacity="0.14" stroke="#4a3aa7"/>
  <text x="695" y="231" text-anchor="middle" font-size="11.5" fill="currentColor" font-weight="600">joint exodus head</text>
  <text x="695" y="247" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.75">P(m0, m1) counts</text>
  <rect x="726" y="200" width="34" height="17" rx="8" fill="#1a1a19"/>
  <text x="743" y="212.5" fill="#fcfcfb" text-anchor="middle" font-size="10">#172</text>
  <rect x="638" y="262" width="114" height="18" rx="4" fill="#1baf7a" fill-opacity="0.2" stroke="#1baf7a"/>
  <text x="695" y="275" text-anchor="middle" font-size="9.5" fill="currentColor">one-hot sizes  #174</text>

  <line x1="695" y1="284" x2="695" y2="322" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="703" y="308" font-size="10" fill="currentColor" opacity="0.75">drawn counts</text>

  <!-- picker -->
  <rect x="600" y="326" width="160" height="52" rx="6" fill="#4a3aa7"
        fill-opacity="0.14" stroke="#4a3aa7"/>
  <text x="680" y="348" text-anchor="middle" font-size="11.5" fill="currentColor" font-weight="600">conditional-Bernoulli picker</text>
  <text x="680" y="364" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.75">who leaves, given the counts</text>
  <rect x="736" y="318" width="34" height="17" rx="8" fill="#1a1a19"/>
  <text x="753" y="330.5" fill="#fcfcfb" text-anchor="middle" font-size="10">#171</text>

  <line x1="640" y1="378" x2="600" y2="545" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="612" y="470" font-size="10.5" fill="currentColor">regroup (rounds 3, 7, 11, ...)</text>

  <!-- ============ PUNISHER BAY ============ -->
  <rect x="810" y="60" width="340" height="470" rx="10" fill="none"
        stroke="currentColor" stroke-opacity="0.35"/>
  <text x="980" y="82" text-anchor="middle" font-size="13" font-weight="600"
        fill="currentColor">PUNISHER BAY</text>
  <text x="980" y="97" text-anchor="middle" font-size="10" fill="currentColor"
        opacity="0.7">the manager: one joint decision per group-round</text>

  <!-- trunk -->
  <rect x="850" y="108" width="260" height="56" rx="6" fill="none"
        stroke="currentColor" stroke-opacity="0.6"/>
  <text x="980" y="131" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600">multinomial logistic trunk</text>
  <text x="980" y="147" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.75">31 levels · round t-1 features only (stock)</text>

  <line x1="980" y1="164" x2="980" y2="284" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="988" y="230" font-size="10" fill="currentColor" opacity="0.75">per-agent multinomial CDFs</text>

  <!-- severity copula -->
  <rect x="850" y="288" width="260" height="62" rx="6" fill="#2a78d6"
        fill-opacity="0.14" stroke="#2a78d6"/>
  <text x="980" y="313" text-anchor="middle" font-size="12" fill="currentColor" font-weight="600">severity copula unit</text>
  <text x="980" y="330" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.75">shared group-round latent, rho = 0.35</text>
  <rect x="1076" y="280" width="34" height="17" rx="8" fill="#1a1a19"/>
  <text x="1093" y="292.5" fill="#fcfcfb" text-anchor="middle" font-size="10">#160</text>

  <line x1="980" y1="350" x2="980" y2="545" stroke="currentColor" marker-end="url(#arr)"/>
  <text x="988" y="470" font-size="10.5" fill="currentColor">punishments p_i (0..30)</text>

  <!-- ============ conveyor ============ -->
  <line x1="30" y1="550" x2="1150" y2="550" stroke="currentColor" stroke-width="1.6"
        marker-end="url(#arr)"/>
  <text x="590" y="572" text-anchor="middle" font-size="11" fill="currentColor">
    round state: contributions -&gt; common good -&gt; punishments</text>
  <path d="M 1150 585 L 30 585" stroke="currentColor" stroke-dasharray="6 5"
        stroke-opacity="0.6" fill="none" marker-end="url(#arr)"/>
  <text x="590" y="605" text-anchor="middle" font-size="10.5" fill="currentColor"
        opacity="0.75">feeds the next round's intakes (24 rounds x 100 episodes, seed 42)</text>

  <!-- bay outputs land on the conveyor -->
  <circle cx="210" cy="550" r="3.5" fill="currentColor"/>
  <circle cx="600" cy="550" r="3.5" fill="currentColor"/>
  <circle cx="980" cy="550" r="3.5" fill="currentColor"/>
</svg>
<figcaption>
The gaussian-MLP stack at its #177 tip, as machinery. Tinted units were
installed by the campaign (badge = the installing PR; tint = the method
category from the progress tree); plain outlines are stock parts; the small
green plates are feature retrofits on an existing part. The dashed per-agent
Bernoulli head is machinery the joint exodus head bypasses.
</figcaption>
</figure>
